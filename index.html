const hasFirebase = () => typeof firebase !== "undefined" && firebase.database;

async function loadData() {
  // Optimistic: read local first for instant UI
  let local = null;
  try {
    const raw = typeof localStorage !== "undefined" ? localStorage.getItem(KEY) : null;
    if (raw) local = mergeWithDefault(JSON.parse(raw));
  } catch {}

  // Then try Firebase; prefer remote if present
  try {
    if (hasFirebase()) {
      const snap = await firebase.database().ref(FB_PATH).once("value");
      const v = snap.val();
      if (v) {
        try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
        return mergeWithDefault(v);
      }
    }
  } catch (e) { console.warn("Firebase load failed:", e); }

  return local || DEFAULT_DATA();
}

async function saveData(d) {
  // Always save locally for instant access
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(KEY, JSON.stringify(d));
    }
  } catch {}
  // Sync to Firebase
  try {
    if (hasFirebase()) {
      await firebase.database().ref(FB_PATH).set(d);
    }
  } catch (e) { console.warn("Firebase save failed:", e); }
}

function subscribeData(callback) {
  if (!hasFirebase()) return () => {};
  const ref = firebase.database().ref(FB_PATH);
  const handler = (snap) => {
    const v = snap.val();
    if (v) {
      try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
      callback(mergeWithDefault(v));
    }
  };
  ref.on("value", handler);
  return () => ref.off("value", handler);
}

function seededRng(seedStr) {
  let s = 0;
  for (let i = 0; i < seedStr.length; i++) s = (s * 31 + seedStr.charCodeAt(i)) >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 0xffffffff;
  };
}

};

// Voice selection: STRICTLY British English. We hard-filter to en-GB to avoid the
// system falling back to Australian (en-AU) or American (en-US) voices, which it
// does by default on many devices when no en-GB voice is explicitly selected.
let _cachedVoice = null;
let _userVoiceName = null;

const setUserVoice = (name) => {
  _userVoiceName = name || null;
  _cachedVoice = null; // force re-pick on next speak
};

const listBritishVoices = () => {
  if (typeof window === "undefined" || !window.speechSynthesis) return [];
  const voices = window.speechSynthesis.getVoices() || [];
  return voices.filter(v =>
    v.lang === "en-GB" ||
    v.lang === "en_GB" ||
    /united kingdom|great britain|british|\buk english\b/i.test(v.name)
  );
};

const _pickVoice = () => {
  if (typeof window === "undefined" || !window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;

  // User-chosen voice takes precedence
  if (_userVoiceName) {
    const userPick = voices.find(v => v.name === _userVoiceName);
    if (userPick) return userPick;
  }

  // HARD FILTER: only true British English voices
  const britishVoices = listBritishVoices();

  // Priority within British voices - prefer high-quality female voices first
  const preferredPatterns = [
    /^Google UK English Female$/i,
    /sonia.*natural/i,
    /libby.*natural/i,
    /microsoft hazel/i,
    /microsoft susan/i,
    /^Serena\b/i,
    /^Kate\b/i,
    /^Martha\b/i,
    /^Stephanie\b/i,
    /^Daniel\b/i,
    /^Arthur\b/i,
    /^Oliver\b/i,
    /^Google UK English Male$/i,
    /microsoft george/i,
    /microsoft ryan/i,
  ];
  for (const pattern of preferredPatterns) {
    const v = britishVoices.find(x => pattern.test(x.name));
    if (v) return v;
  }

  // Any remaining British voice
  if (britishVoices.length) return britishVoices[0];

  // No British voice available - fall back to American (closer to British than Australian)
  // but EXPLICITLY skip en-AU
  const enUS = voices.find(v => v.lang === "en-US");
  if (enUS) return enUS;
  return voices.find(v => v.lang && v.lang.startsWith("en") && v.lang !== "en-AU") || null;
};

if (typeof window !== "undefined" && window.speechSynthesis) {
  // Trigger initial voice load (voices often load asynchronously)
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener?.("voiceschanged", () => {
    _cachedVoice = _pickVoice();
  });
}

const speak = (text) => {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    // Small delay so cancel completes before new utterance starts (prevents cut-offs)
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      // Re-pick if we haven't got a British voice yet (voices may have loaded since)
      if (!_cachedVoice || (_cachedVoice.lang !== "en-GB" && _cachedVoice.lang !== "en_GB")) {
        const fresh = _pickVoice();
        if (fresh) _cachedVoice = fresh;
      }
      if (_cachedVoice) {
        u.voice = _cachedVoice;
        u.lang = _cachedVoice.lang;
      } else {
        u.lang = "en-GB";
      }
      u.rate = 0.9;
      u.pitch = 1.05;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }, 60);
  } catch {}
};

const PHASE5 = [
  { g: "ai", aud: "ay",  words: ["rain","train","wait","pain","main","sail"] },
  { g: "ay", aud: "ay",  words: ["day","play","stay","may","say","tray"] },
  { g: "ee", aud: "ee",  words: ["tree","see","feet","week","bee","green"] },
  { g: "ea", aud: "ee",  words: ["sea","read","beach","leaf","each","tea"] },
  { g: "oa", aud: "oh",  words: ["boat","coat","road","goat","toast","soap"] },
  { g: "ow", aud: "oh",  words: ["snow","grow","blow","slow","show","low"] },
  { g: "igh",aud: "eye", words: ["light","night","right","sigh","high","fight"] },
  { g: "ar", aud: "ar",  words: ["car","park","star","arm","hard","farm"] },
  { g: "or", aud: "or",  words: ["fork","sort","torn","short","cork","horn"] },
  { g: "ur", aud: "er",  words: ["fur","hurt","turn","burn","curl","surf"] },
  { g: "oi", aud: "oy",  words: ["oil","coin","boil","spoil","join","soil"] },
  { g: "ou", aud: "ow",  words: ["out","loud","cloud","sound","round","shout"] },
];

// Days of the week & months (capital letter rule)
const CAPITAL_WORDS = ["Monday","Tuesday","Wednesday","London","Charlie","Freddie","England","July","Easter","Christmas","Hannah"];

/* ============================ PRESCHOOL DATA ============================ */
// Phase 2 letters (in teaching order)
const PHASE2 = "satpinmdgockubelfhrss".split("");

// Example words demonstrating each pure phonic sound. We use example-word audio cues
// because TTS engines reliably mispronounce isolated phoneme strings (saying "A" for "ah",
// "n-g" for "ng" etc). Letting TTS speak a real word gives the child the pure sound naturally.
const PHONEME_EXAMPLE = {
  s: "snake", a: "apple", t: "top", p: "pig", i: "igloo",
  n: "nest", m: "mum", d: "dog", g: "goat", o: "octopus",
  c: "cat", k: "king", u: "up", b: "bat", e: "egg",
  l: "leg", f: "fish", h: "hat", r: "rain",
};
// Phase 3 sounds
const PHASE3 = [
  { g: "ch", words: ["chip","chin","chop","much"] },
  { g: "sh", words: ["ship","shop","fish","shell"] },
  { g: "th", words: ["this","that","thin","with"] },
  { g: "ng", words: ["ring","sing","king","long"] },
  { g: "ai", words: ["rain","sail","pain","wait"] },
  { g: "ee", words: ["see","feet","bee","week"] },
  { g: "oa", words: ["boat","goat","road","soap"] },
  { g: "oo", words: ["look","book","good","took"] },
];
const CVC = ["cat","dog","pig","hat","mum","dad","sun","bed","cup","ten","big","red","fox","bus","jam","top","pet","leg","run","sit","map","tin","mud","wet","hop","nap","bag","cap","fan","kid","log","pan"];

// Rhyming pairs
const RHYMES = [
  ["cat","hat"], ["dog","log"], ["pig","big"], ["sun","run"], ["red","bed"],
  ["ten","hen"], ["mop","top"], ["bus","fuss"], ["fox","box"], ["jam","ham"],
];

/* ============================ Y1 QUESTION GENERATORS ============================ */
// Each generator returns { subject, type, prompt, audio, answer, options, mode }
// mode: "choice" (tap an option) or "type" (text input)

function qPhonicsGrapheme(rng) {
  const pair = pick(PHASE5, rng);
  const word = pick(pair.words, rng);
  const distractors = sample(PHASE5.filter(p => p.g !== pair.g), 3, rng).map(p => p.g);
  return {
    subject: "phonics",
    type: "grapheme",
    prompt: `Which letters make the sound in this word?`,
    word,
    audio: `Which letters make the sound in the word ${word}?`,
    answer: pair.g,
    options: shuffle([pair.g, ...distractors], rng),
    mode: "choice",
  };
}

function qPhonicsFindWord(rng) {
  const pair = pick(PHASE5, rng);
  const correct = pick(pair.words, rng);
  const other = sample(PHASE5.filter(p => p.aud !== pair.aud), 3, rng);
  const distractors = other.map(p => pick(p.words, rng));
  return {
    subject: "phonics",
    type: "find_sound",
    prompt: `Which word has the "${pair.g}" sound (like in ${pair.words[0]})?`,
    audio: `Which word has the sound ${pair.aud}?`,
    answer: correct,
    options: shuffle([correct, ...distractors], rng),
    mode: "choice",
  };
}

function qCewRead(rng, pool) {
  const target = pick(pool, rng);
  const distractors = sample(pool.filter(w => w !== target), 3, rng);
  return {
    subject: "cew",
    type: "cew_read",
    prompt: `Find the tricky word:`,
    audio: `Find the word ${target}.`,
    spoken: target,
    answer: target,
    options: shuffle([target, ...distractors], rng),
    mode: "choice",
  };
}

function qCewSpell(rng, pool) {
  const target = pick(pool.filter(w => w.length <= 5 && w !== "I"), rng);
  return {
    subject: "spelling",
    type: "spell",
    prompt: `Spell the tricky word you hear:`,
    audio: `Spell the word ${target}.`,
    spoken: target,
    answer: target,
    mode: "type",
  };
}

function qHfwSpell(rng, pool) {
  const target = pick(pool.filter(w => w.length <= 4), rng);
  return {
    subject: "spelling",
    type: "spell_hfw",
    prompt: `Spell this word:`,
    audio: `Spell the word ${target}.`,
    spoken: target,
    answer: target,
    mode: "type",
  };
}

function qPlural(rng) {
  const wordsS  = ["cat","dog","book","tree","car","hat","cup","star"];
  const wordsEs = ["box","bus","fox","kiss","wish","glass","brush"];
  const useEs = rng() < 0.4;
  const w = pick(useEs ? wordsEs : wordsS, rng);
  const correct = useEs ? w + "es" : w + "s";
  const distractors = useEs
    ? [w + "s", w + "ies", w + "z"]
    : [w + "es", w + "ies", w + "z"];
  return {
    subject: "grammar",
    type: "plural",
    prompt: `Make this word mean more than one:`,
    word: w,
    audio: `How do you spell more than one ${w}?`,
    answer: correct,
    options: shuffle([correct, ...distractors], rng),
    mode: "choice",
  };
}

function qSuffixIng(rng) {
  const set = [
    { base: "jump", out: "jumping" },
    { base: "play", out: "playing" },
    { base: "look", out: "looking" },
    { base: "read", out: "reading" },
    { base: "go",   out: "going" },
    { base: "sing", out: "singing" },
    { base: "help", out: "helping" },
  ];
  const item = pick(set, rng);
  const distractors = [
    item.base + "ed",
    item.base + "ying",
    item.base + "inn",
  ];
  return {
    subject: "grammar",
    type: "suffix_ing",
    prompt: `Add "ing" to this word:`,
    word: item.base,
    audio: `Add ing to the word ${item.base}.`,
    answer: item.out,
    options: shuffle([item.out, ...distractors], rng),
    mode: "choice",
  };
}

function qSuffixEd(rng) {
  const set = [
    { base: "jump", out: "jumped" },
    { base: "play", out: "played" },
    { base: "look", out: "looked" },
    { base: "help", out: "helped" },
    { base: "talk", out: "talked" },
    { base: "ask",  out: "asked" },
  ];
  const item = pick(set, rng);
  const distractors = [
    item.base + "ing",
    item.base + "id",
    item.base + "t",
  ];
  return {
    subject: "grammar",
    type: "suffix_ed",
    prompt: `Make this word past tense (add "ed"):`,
    word: item.base,
    audio: `Put the word ${item.base} into the past tense.`,
    answer: item.out,
    options: shuffle([item.out, ...distractors], rng),
    mode: "choice",
  };
}

function qPrefixUn(rng) {
  const set = [
    { base: "happy", meaning: "not happy" },
    { base: "kind",  meaning: "not kind" },
    { base: "well",  meaning: "not well" },
    { base: "tidy",  meaning: "not tidy" },
    { base: "safe",  meaning: "not safe" },
  ];
  const item = pick(set, rng);
  const correct = "un" + item.base;
  const distractors = [
    "re" + item.base,
    item.base + "less",
    "dis" + item.base,
  ];
  return {
    subject: "grammar",
    type: "prefix_un",
    prompt: `Which word means "${item.meaning}"?`,
    audio: `Which word means ${item.meaning}?`,
    answer: correct,
    options: shuffle([correct, ...distractors], rng),
    mode: "choice",
  };
}

function qFullStopOrQuestion(rng) {
  const sentences = [
    { text: "I love my dog", end: "." },
    { text: "What is your name", end: "?" },
    { text: "Where do you live", end: "?" },
    { text: "We went to the park", end: "." },
    { text: "How old are you", end: "?" },
    { text: "The cat sat on the mat", end: "." },
  ];
  const s = pick(sentences, rng);
  return {
    subject: "punctuation",
    type: "punctuation_end",
    prompt: `Which punctuation mark goes at the end?`,
    sentence: s.text,
    audio: `${s.text}. Which mark goes at the end?`,
    answer: s.end,
    options: shuffle([".", "?", "!", ","], rng),
    mode: "choice",
  };
}

function qExclaim(rng) {
  const sentences = [
    { text: "What a lovely day", end: "!" },
    { text: "Watch out", end: "!" },
    { text: "How funny that is", end: "!" },
    { text: "I am six", end: "." },
    { text: "Are you ready", end: "?" },
  ];
  const s = pick(sentences, rng);
  return {
    subject: "punctuation",
    type: "punctuation_exclaim",
    prompt: `Choose the right punctuation:`,
    sentence: s.text,
    audio: `${s.text}. Which mark fits best?`,
    answer: s.end,
    options: shuffle([".", "?", "!", ","], rng),
    mode: "choice",
  };
}

function qCapital(rng) {
  const sentences = [
    { words: ["we","went","to","london"], answer: 3 },
    { words: ["i","like","apples"], answer: 0 },
    { words: ["my","name","is","charlie"], answer: 3 },
    { words: ["on","monday","we","played"], answer: 1 },
    { words: ["it","is","july"], answer: 2 },
    { words: ["she","lives","in","england"], answer: 3 },
  ];
  const s = pick(sentences, rng);
  const correct = s.words[s.answer];
  return {
    subject: "punctuation",
    type: "capital",
    prompt: `Which word needs a capital letter?`,
    audio: `Which word needs a capital letter in this sentence: ${s.words.join(" ")}`,
    sentence: s.words.join(" "),
    answer: correct,
    options: shuffle(s.words, rng),
    mode: "choice",
  };
}

function qConjunction(rng) {
  const set = [
    { before: "I had toast", after: "I had juice", word: "and" },
    { before: "I was tired", after: "I went to bed", word: "so" },
    { before: "I like cats", after: "I love dogs more", word: "but" },
    { before: "We ate dinner", after: "we watched a film", word: "then" },
  ];
  const item = pick(set, rng);
  const distractors = ["if","because","or","when"].filter(w => w !== item.word).slice(0,3);
  return {
    subject: "grammar",
    type: "conjunction",
    prompt: `Which word joins these sentences?`,
    sentence: `${item.before} ___ ${item.after}.`,
    audio: `${item.before}, blank, ${item.after}.`,
    answer: item.word,
    options: shuffle([item.word, ...distractors], rng),
    mode: "choice",
  };
}

function qWordClass(rng) {
  const set = [
    { text: ["The","cat","runs","fast"], type: "verb",      answer: "runs" },
    { text: ["A","big","dog","barked"],  type: "adjective", answer: "big" },
    { text: ["The","red","car","stops"], type: "noun",      answer: "car" },
    { text: ["My","mum","is","happy"],   type: "adjective", answer: "happy" },
    { text: ["The","boy","plays","ball"],type: "verb",      answer: "plays" },
    { text: ["I","saw","a","star"],      type: "noun",      answer: "star" },
  ];
  const item = pick(set, rng);
  return {
    subject: "grammar",
    type: "word_class",
    prompt: `Which word is a ${item.type}?`,
    sentence: item.text.join(" "),
    audio: `In this sentence: ${item.text.join(" ")}. Which word is a ${item.type}?`,
    answer: item.answer,
    options: shuffle(item.text, rng),
    mode: "choice",
  };
}

function qCewMissing(rng, pool) {
  const target = pick(pool.filter(w => w.length >= 3 && w !== "I"), rng);
  const idx = 1; // hide 2nd letter
  const hidden = target[idx];
  const shown = target.slice(0, idx) + "_" + target.slice(idx + 1);
  return {
    subject: "cew",
    type: "cew_missing",
    prompt: `Fill in the missing letter:`,
    word: shown,
    full: target,
    audio: `What letter is missing in the word ${target}?`,
    answer: hidden,
    mode: "type",
  };
}

/* ============================ PRESCHOOL QUESTION GENERATORS ============================ */
function qLetterName(rng) {
  const letter = pick(PHASE2, rng);
  const distractors = sample(PHASE2.filter(l => l !== letter), 3, rng);
  const example = PHONEME_EXAMPLE[letter] || letter;
  return {
    subject: "phonics",
    type: "letter_name",
    prompt: `Which letter makes the sound at the start of "${example}"?`,
    audio: `Which letter makes the sound at the start of ${example}?`,
    answer: letter,
    options: shuffle([letter, ...distractors], rng),
    mode: "choice",
  };
}

function qInitialSound(rng) {
  const word = pick(CVC, rng);
  const initial = word[0];
  const distractors = sample("satpinmdgockubelfhr".split("").filter(l => l !== initial), 3, rng);
  return {
    subject: "phonics",
    type: "initial_sound",
    prompt: `What letter does this word start with?`,
    word,
    audio: `What letter does the word ${word} start with?`,
    answer: initial,
    options: shuffle([initial, ...distractors], rng),
    mode: "choice",
  };
}

function qCvcRead(rng) {
  const target = pick(CVC, rng);
  const distractors = sample(CVC.filter(w => w !== target), 3, rng);
  return {
    subject: "reading",
    type: "cvc_read",
    prompt: `Which word is this?`,
    audio: `Which word says ${target}?`,
    spoken: target,
    answer: target,
    options: shuffle([target, ...distractors], rng),
    mode: "choice",
  };
}

function qRhyme(rng) {
  const [a, b] = pick(RHYMES, rng);
  const otherPairs = RHYMES.filter(p => !p.includes(a));
  const distractors = sample(otherPairs, 3, rng).map(p => p[0]);
  return {
    subject: "reading",
    type: "rhyme",
    prompt: `Which word rhymes with "${a}"?`,
    audio: `Which word rhymes with ${a}?`,
    answer: b,
    options: shuffle([b, ...distractors], rng),
    mode: "choice",
  };
}

function qPhase3Sound(rng) {
  const pair = pick(PHASE3, rng);
  const word = pick(pair.words, rng);
  const distractors = sample(PHASE3.filter(p => p.g !== pair.g), 3, rng).map(p => p.g);
  return {
    subject: "phonics",
    type: "phase3",
    prompt: `Which sound do you hear in this word?`,
    word,
    audio: `Which sound do you hear in the word ${word}?`,
    answer: pair.g,
    options: shuffle([pair.g, ...distractors], rng),
    mode: "choice",
  };
}

/* ============================ DAY GENERATION ============================ */
function generateY1Day(rng, term) {
  // CEW pool grows through the year
  let cewPool;
  if (term === "autumn") {
    cewPool = ["the","a","do","to","of","said","I","you","be","he","me","she","we","no","go","so","my","is","was"];
  } else if (term === "spring") {
    cewPool = Y1_CEW.slice(0, 30);
  } else {
    cewPool = Y1_CEW;
  }

  // Pools of question generators per term
  const generators = [
    () => qPhonicsGrapheme(rng),
    () => qPhonicsFindWord(rng),
    () => qCewRead(rng, cewPool),
    () => qCewSpell(rng, cewPool),
    () => qHfwSpell(rng, Y1_HFW),
    () => qFullStopOrQuestion(rng),
    () => qCapital(rng),
  ];
  if (term !== "autumn") {
    generators.push(() => qPlural(rng));
    generators.push(() => qSuffixIng(rng));
    generators.push(() => qCewMissing(rng, cewPool));
  }
  if (term === "summer") {
    generators.push(() => qSuffixEd(rng));
    generators.push(() => qPrefixUn(rng));
    generators.push(() => qExclaim(rng));
    generators.push(() => qConjunction(rng));
    generators.push(() => qWordClass(rng));
  }

  // 10 main questions, varied across generators
  const main = [];
  const shuffled = shuffle(generators, rng);
  // Cycle through generators ensuring variety
  for (let i = 0; i < 10; i++) {
    const gen = shuffled[i % shuffled.length];
    main.push(gen());
  }

  // 2 challenger questions (push into the next stretch)
  let challenger;
  if (term === "autumn") {
    challenger = [qPlural(rng), qSuffixIng(rng)];
  } else if (term === "spring") {
    challenger = [qPrefixUn(rng), qWordClass(rng)];
  } else {
    challenger = [qWordClass(rng), qConjunction(rng)];
  }

  return [
    ...main.map((q, i) => ({ ...q, idx: i, challenger: false })),
    ...challenger.map((q, i) => ({ ...q, idx: 10 + i, challenger: true })),
  ];
}

function generatePreschoolDay(rng, term) {
  const generators = [
    () => qLetterName(rng),
    () => qInitialSound(rng),
  ];
  if (term !== "autumn") {
    generators.push(() => qCvcRead(rng));
    generators.push(() => qRhyme(rng));
  }
  if (term === "summer") {
    generators.push(() => qPhase3Sound(rng));
  }

  const main = [];
  const shuffled = shuffle(generators, rng);
  for (let i = 0; i < 8; i++) { // 8 questions for preschool, smaller dose
    const gen = shuffled[i % shuffled.length];
    main.push(gen());
  }
  // 2 challenger
  const challenger = term === "autumn"
    ? [qCvcRead(rng), qRhyme(rng)]
    : [qPhase3Sound(rng), qCvcRead(rng)];

  return [
    ...main.map((q, i) => ({ ...q, idx: i, challenger: false })),
    ...challenger.map((q, i) => ({ ...q, idx: 8 + i, challenger: true })),
  ];
}

function generateDay(profile, dateISO) {
  const rng = seededRng(`${profile.id}-${dateISO}`);
  const term = getTerm(new Date(dateISO + "T00:00:00"));
  return profile.year === "year1"
    ? generateY1Day(rng, term)
    : generatePreschoolDay(rng, term);
}

/* ============================ UI: ROOT ============================ */
function PhonicsApp() {
  const [data, setData] = useState(null);
  const [view, setView] = useState("home"); // home | practice | results | collection | settings
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let mounted = true;
    loadData().then(d => { if (mounted) { setData(d); setReady(true); } });
    // Subscribe to remote changes for cross-device sync
    const unsub = subscribeData((d) => {
      if (mounted) {
        // Only update if the data is meaningfully newer (avoid feedback loops)
        setData(prev => {
          if (!prev) return d;
          if (JSON.stringify(prev) === JSON.stringify(d)) return prev;
          return d;
        });
      }
    });
    return () => { mounted = false; unsub(); };
  }, []);

  // Sync user-selected voice name with the speech module
  useEffect(() => {
    if (data) setUserVoice(data.voiceName || null);
  }, [data && data.voiceName]);

  const persist = (next) => {
    setData(next);
    saveData(next);
  };
  const activeProfile = data && data.activeId ? data.profiles[data.activeId] : null;

  if (!ready) return <div style={{ minHeight: "100vh", background: "#F5EFE6" }} />;

  return (
    <div style={S.shell}>
      <style>{cssReset}</style>
      {!activeProfile ? (
        <ProfilePicker data={data} onPick={(id) => persist({ ...data, activeId: id })} />
      ) : (
        <>
          <Header profile={activeProfile} onSwitch={() => persist({ ...data, activeId: null })} />
          {view === "home" && <HomeView profile={activeProfile} data={data} setData={persist} onStart={() => setView("practice")} setView={setView} />}
          {view === "practice" && <PracticeView profile={activeProfile} data={data} setData={persist} onDone={() => setView("home")} />}
          {view === "results" && <ResultsView profile={activeProfile} onBack={() => setView("home")} />}
          {view === "collection" && <CollectionView profile={activeProfile} data={data} setData={persist} onBack={() => setView("home")} />}
          {view === "settings" && <SettingsView profile={activeProfile} data={data} setData={persist} onBack={() => setView("home")} />}
          {view !== "practice" && <BottomNav view={view} setView={setView} />}
        </>
      )}
    </div>
  );
}

/* ============================ HOME ============================ */
function HomeView({ profile, data, setData, onStart, setView }) {
  const today = todayISO();
  const todayDone = profile.days && profile.days[today];
  const term = getTerm();
  const termLabel = { autumn: "Autumn term", spring: "Spring term", summer: "Summer term" }[term];

/* ============================ PRACTICE ============================ */
function PracticeView({ profile, data, setData, onDone }) {
  const today = todayISO();
  const [extraSeed, setExtraSeed] = useState(0);
  const questions = useMemo(() => generateDay(profile, today + (extraSeed ? "-x" + extraSeed : "")), [profile.id, profile.year, today, extraSeed]);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [typed, setTyped] = useState("");
  const [showFeedback, setShowFeedback] = useState(false);
  const inputRef = useRef(null);
  const q = questions[idx];
  const isExtra = extraSeed > 0;

  useEffect(() => {
    if (q && q.audio) speak(q.audio);
    setTyped("");
    setShowFeedback(false);
    if (q && q.mode === "type" && inputRef.current) {
      setTimeout(() => inputRef.current && inputRef.current.focus(), 100);
    }
  }, [idx, extraSeed]);

  if (!q) {
    return <DoneScreen profile={profile} data={data} setData={setData} answers={answers} questions={questions} onDone={onDone} isExtra={isExtra} onExtra={() => { setExtraSeed(extraSeed + 1); setIdx(0); setAnswers({}); }} />;
  }

  const handleChoice = (option) => {
    const correct = option === q.answer;
    const newAnswers = { ...answers, [idx]: { value: option, correct } };
    setAnswers(newAnswers);
    setShowFeedback(true);
    setTimeout(() => {
      setShowFeedback(false);
      setIdx(idx + 1);
    }, 900);
  };

  const handleType = () => {
    if (!typed.trim()) return;
    const correct = typed.trim().toLowerCase() === String(q.answer).toLowerCase();
    const newAnswers = { ...answers, [idx]: { value: typed.trim(), correct } };
    setAnswers(newAnswers);
    setShowFeedback(true);
    setTimeout(() => {
      setShowFeedback(false);
      setIdx(idx + 1);
    }, 1100);
  };

  const total = questions.length;
  const pct = Math.round((idx / total) * 100);
  const score = Object.values(answers).filter(a => a.correct).length;

  return (
    <div style={S.body}>
      <div style={S.practiceTop}>
        <div style={S.progressBar}>
          <div style={{ ...S.progressFill, width: `${pct}%` }} />
        </div>
        <div style={S.progressLabel}>Question {idx + 1} of {total}</div>
      </div>

      {q.challenger && (
        <div style={S.challengerBadge}>
          <Sparkles size={12} /> <span style={{ marginLeft: 4 }}>Challenger question</span>
        </div>
      )}

      <div style={S.subjectChip} >
        <span style={{ ...S.subjectDot, background: SUBJECTS[q.subject].colour }} />
        {SUBJECTS[q.subject].label}
      </div>

      <div style={S.qCard}>
        <div style={S.qPrompt}>
          {q.prompt}
          <button style={S.speakBtn} onClick={() => speak(q.audio || q.prompt)}>
            <Volume2 size={18} />
          </button>
        </div>

        {q.bigChar && (
          <div style={S.bigChar}>{q.bigChar}</div>
        )}
        {q.word && !q.bigChar && (
          <div style={S.wordBox}>{q.word}</div>
        )}
        {q.sentence && (
          <div style={S.sentenceBox}>"{q.sentence}"</div>
        )}
        {q.spoken && q.mode === "type" && !q.word && !q.sentence && (
          <button style={S.hearBtn} onClick={() => speak(q.spoken)}>
            <Volume2 size={16} /> <span style={{ marginLeft: 6 }}>Hear it again</span>
          </button>
        )}

        {q.mode === "choice" && (
          <div style={S.choicesGrid}>
            {q.options.map((opt, i) => {
              const isAnswered = showFeedback && answers[idx] && answers[idx].value === opt;
              const isCorrect = showFeedback && opt === q.answer && answers[idx];
              return (
                <button
                  key={i}
                  onClick={() => !showFeedback && handleChoice(opt)}
                  disabled={showFeedback}
                  style={{
                    ...S.choiceBtn,
                    ...(isCorrect ? S.choiceCorrect : {}),
                    ...(isAnswered && !answers[idx].correct ? S.choiceWrong : {}),
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        )}

        {q.mode === "type" && (
          <div style={{ marginTop: 18 }}>
            <input
              ref={inputRef}
              value={typed}
              onChange={(e) => setTyped(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && handleType()}
              placeholder="Type your answer"
              autoCapitalize="none"
              autoCorrect="off"
              spellCheck="false"
              style={S.typeInput}
            />
            <button onClick={handleType} disabled={showFeedback} style={S.submitBtn}>
              Check answer
            </button>
            {showFeedback && answers[idx] && (
              <div style={{ ...S.feedback, color: answers[idx].correct ? "#1a6d4a" : "#a23030", marginTop: 12 }}>
                {answers[idx].correct ? (
                  <><Check size={16} /> <span style={{ marginLeft: 6 }}>Brilliant!</span></>
                ) : (
                  <><X size={16} /> <span style={{ marginLeft: 6 }}>The answer was "{q.answer}"</span></>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      <div style={S.scorePill}>
        <Star size={14} color="#D4A04A" />
        <span style={{ marginLeft: 6 }}>{score} correct so far</span>
      </div>
    </div>
  );
}

/* ============================ DONE SCREEN ============================ */
function DoneScreen({ profile, data, setData, answers, questions, onDone, onExtra, isExtra }) {
  const total = questions.length;
  const score = Object.values(answers).filter(a => a.correct).length;
  const pct = Math.round((score / total) * 100);

  // Update data once
  useEffect(() => {
    const today = todayISO();
    const alreadyDone = profile.days && profile.days[today];
    // If this is a fresh first-of-day run AND day already saved, skip (re-render guard)
    if (!isExtra && alreadyDone) return;

    // Per-subject tally
    const perSubject = {};
    questions.forEach((q, i) => {
      const sub = q.subject;
      if (!perSubject[sub]) perSubject[sub] = { attempts: 0, correct: 0 };
      perSubject[sub].attempts += 1;
      if (answers[i] && answers[i].correct) perSubject[sub].correct += 1;
    });

    // Aggregate into profile subjects
    const subjects = { ...(profile.subjects || {}) };
    for (const [k, v] of Object.entries(perSubject)) {
      if (!subjects[k]) subjects[k] = { attempts: 0, correct: 0 };
      subjects[k].attempts += v.attempts;
      subjects[k].correct += v.correct;
    }

    let earned, streak, lastDate, days;
    if (isExtra) {
      // Bonus practice: 2 points per correct, no day bonus, streak/day unchanged
      earned = score * 2;
      streak = profile.streak || 0;
      lastDate = profile.lastDate;
      days = profile.days || {};
    } else {
      const challengerCorrect = questions.filter((q, i) => q.challenger && answers[i] && answers[i].correct).length;
      earned = score * 5 + 10 + challengerCorrect * 5;
      // Streak
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
      const yISO = (() => {
        const y = yesterday.getFullYear(), m = String(yesterday.getMonth() + 1).padStart(2, "0"), dd = String(yesterday.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      })();
      streak = profile.streak || 0;
      if (profile.lastDate === yISO) streak += 1;
      else if (profile.lastDate === today) {} // unchanged
      else streak = 1;
      lastDate = today;
      days = { ...(profile.days || {}), [today]: { score, total, finishedAt: new Date().toISOString(), perSubject, earned } };
    }

    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: {
          ...profile,
          points: (profile.points || 0) + earned,
          streak, lastDate, subjects, days,
        },
      },
    };
    setData(next);
  }, []);

  const earnedPoints = isExtra ? score * 2 : score * 5 + 10;

  return (
    <div style={S.body}>
      <div style={S.doneTitle}>{pct >= 80 ? "Amazing work!" : pct >= 50 ? "Good job!" : "Keep going!"}</div>
      <div style={S.doneBig}>{score}/{total}</div>
      <div style={S.doneSub}>{pct}% correct{isExtra ? " · bonus round" : ""}</div>

      <div style={S.doneEmoji}>{THEMES[profile.theme].items[0].emoji}</div>

      <div style={S.doneCard2}>
        <div style={{ fontWeight: 700, marginBottom: 6 }}>You earned</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 700, color: "#D4A04A" }}>
          <Star size={20} color="#D4A04A" /> <span style={{ marginLeft: 8 }}>{earnedPoints}{isExtra ? "" : "+"} points</span>
        </div>
      </div>

      <button onClick={onExtra} style={S.bigBtn}>
        <Pencil size={18} /> <span style={{ marginLeft: 8 }}>More practice</span>
      </button>
      <button onClick={onDone} style={{ ...S.bigBtn, background: "#143232", marginTop: 12 }}>
        <HomeIcon size={18} /> <span style={{ marginLeft: 8 }}>Back home</span>
      </button>
    </div>
  );
}

/* ============================ RESULTS ============================ */
function ResultsView({ profile, onBack }) {
  const subjects = profile.subjects || {};
  const days = profile.days || {};
  const dayCount = Object.keys(days).length;
  const totalCorrect = Object.values(days).reduce((s, d) => s + (d.score || 0), 0);
  const totalQuestions = Object.values(days).reduce((s, d) => s + (d.total || 0), 0);

  // Sort subjects by accuracy
  const subjectRows = Object.entries(SUBJECTS).map(([key, meta]) => {
    const s = subjects[key];
    const acc = s && s.attempts > 0 ? Math.round((s.correct / s.attempts) * 100) : null;
    return { key, meta, attempts: s ? s.attempts : 0, correct: s ? s.correct : 0, acc };
  });

  const bestRow = subjectRows.filter(r => r.acc !== null).sort((a, b) => b.acc - a.acc)[0];
  const workRow = subjectRows.filter(r => r.acc !== null && r.attempts >= 5).sort((a, b) => a.acc - b.acc)[0];

  // Last 14 days for streak chart
  const last14 = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    last14.push({ iso, day: d.toLocaleDateString("en-GB", { weekday: "narrow" }), done: !!days[iso], score: days[iso] ? days[iso].score : 0, total: days[iso] ? days[iso].total : 0 });
  }

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Home</span></button>
      <div style={S.pageTitle}>Results</div>

      <div style={S.statsRow}>
        <div style={S.statBox}>
          <div style={S.statNum}>{dayCount}</div>
          <div style={S.statLabel}>Days done</div>
        </div>
        <div style={S.statBox}>
          <div style={S.statNum}>{totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0}%</div>
          <div style={S.statLabel}>Overall</div>
        </div>
        <div style={S.statBox}>
          <div style={S.statNum}>{profile.streak || 0}</div>
          <div style={S.statLabel}>Streak</div>
        </div>
      </div>

      {(bestRow || workRow) && (
        <div style={S.insightCard}>
          {bestRow && (
            <div style={{ marginBottom: workRow ? 10 : 0 }}>
              <div style={S.insightLabel}>You're great at</div>
              <div style={S.insightValue}>
                <span style={{ ...S.subjectDot, background: bestRow.meta.colour }} />
                {bestRow.meta.label} ({bestRow.acc}%)
              </div>
            </div>
          )}
          {workRow && workRow.key !== (bestRow && bestRow.key) && (
            <div>
              <div style={S.insightLabel}>Let's work on</div>
              <div style={S.insightValue}>
                <span style={{ ...S.subjectDot, background: workRow.meta.colour }} />
                {workRow.meta.label} ({workRow.acc}%)
              </div>
            </div>
          )}
        </div>
      )}

      <div style={S.sectionTitle}>By subject</div>
      <div>
        {subjectRows.map((r) => (
          <div key={r.key} style={S.subjectRow}>
            <div style={{ display: "flex", alignItems: "center", marginBottom: 6 }}>
              <span style={{ ...S.subjectDot, background: r.meta.colour }} />
              <span style={{ fontWeight: 600, flex: 1 }}>{r.meta.label}</span>
              <span style={{ color: "#5a6b5f", fontSize: 13 }}>
                {r.attempts > 0 ? `${r.correct}/${r.attempts}` : "Not yet"}
              </span>
            </div>
            <div style={S.barTrack}>
              <div style={{ ...S.barFill, width: r.acc !== null ? `${r.acc}%` : "0%", background: r.meta.colour }} />
            </div>
            {r.acc !== null && (
              <div style={{ fontSize: 12, color: "#5a6b5f", marginTop: 4 }}>{r.acc}%</div>
            )}
          </div>
        ))}
      </div>

      <div style={S.sectionTitle}>Last 14 days</div>
      <div style={S.calRow}>
        {last14.map(d => (
          <div key={d.iso} style={S.calDay}>
            <div style={{
              ...S.calDot,
              background: d.done ? (d.score / d.total >= 0.8 ? "#3DAA7C" : d.score / d.total >= 0.5 ? "#D4A04A" : "#E07856") : "#E5DDC9",
            }}>{d.done ? d.score : ""}</div>
            <div style={S.calLabel}>{d.day}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================ COLLECTION ============================ */
function CollectionView({ profile, data, setData, onBack }) {
  const theme = THEMES[profile.theme];

  const buy = (item) => {
    if (profile.collection.includes(item.id)) return;
    if ((profile.points || 0) < item.price) return;
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: {
          ...profile,
          points: (profile.points || 0) - item.price,
          collection: [...profile.collection, item.id],
          favourite: profile.favourite || item.id,
        },
      },
    };
    setData(next);
  };

  const setFavourite = (id) => {
    if (!profile.collection.includes(id)) return;
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: { ...profile, favourite: id },
      },
    };
    setData(next);
  };

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Home</span></button>
      <div style={S.pageTitle}>{theme.label} Collection</div>
      <div style={S.subTitle}>
        Earn <Star size={14} color="#D4A04A" style={{ display: "inline", verticalAlign: "middle" }} /> points by practising. Tap to unlock or set as favourite.
      </div>
      <div style={S.collGrid}>
        {theme.items.map(item => {
          const owned = profile.collection.includes(item.id);
          const isFav = profile.favourite === item.id;
          const canAfford = (profile.points || 0) >= item.price;
          return (
            <div key={item.id} style={{
              ...S.collCard,
              ...(isFav ? S.collFav : {}),
              opacity: owned || canAfford ? 1 : 0.55,
            }}>
              <div style={{ fontSize: 44, lineHeight: 1 }}>{owned ? item.emoji : "❓"}</div>
              <div style={S.collName}>{owned ? item.name : "Locked"}</div>
              {owned ? (
                <button
                  onClick={() => setFavourite(item.id)}
                  style={{ ...S.collBtn, background: isFav ? "#143232" : "transparent", color: isFav ? "#fff" : "#143232" }}
                >
                  {isFav ? "Favourite" : "Pick"}
                </button>
              ) : (
                <button
                  onClick={() => buy(item)}
                  disabled={!canAfford}
                  style={{ ...S.collBtn, background: canAfford ? "#D4A04A" : "#E5DDC9", color: "#143232" }}
                >
                  {canAfford ? <><Star size={11} color="#143232" /> <span style={{ marginLeft: 4 }}>{item.price}</span></> : <><Lock size={11} /> <span style={{ marginLeft: 4 }}>{item.price}</span></>}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    refresh();
    if (typeof window !== "undefined" && window.speechSynthesis) {
      window.speechSynthesis.addEventListener?.("voiceschanged", refresh);
      return () => window.speechSynthesis.removeEventListener?.("voiceschanged", refresh);
    }
  }, []);

  const setTheme = (theme) => {
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: { ...profile, theme, favourite: null },
      },
    };
    setData(next);
  };

      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: { ...profile, year },

    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: newProfile(profile.id, profile.name, profile.year, profile.theme),

          <>
            <div style={{ fontSize: 13, color: "#5a6b5f", marginBottom: 8 }}>Pick a voice from those installed on this device:</div>

      <div style={{ ...S.insightCard, marginTop: 8 }}>

        <div style={{ marginTop: 8, fontSize: 13, color: "#5a6b5f" }}>Currently: <strong>{ {autumn: "Autumn", spring: "Spring", summer: "Summer"}[getTerm()] } term</strong> (auto-detected from today's date).</div>

      <div style={{ marginTop: 24 }}>

/* ============================ STORAGE ============================ */
// Cross-device storage: Firebase Realtime Database (primary) with localStorage fallback.
// FIREBASE_CONFIG and FAMILY_CODE are defined in the HTML scaffold.
const HAS_FB = typeof firebase !== "undefined" && typeof FAMILY_CODE !== "undefined";
const HAS_LS = typeof localStorage !== "undefined";
const MEM = {};
const PROFILES_KEY = "reading_app_profiles_v1";
const API_KEY_KEY = "reading_app_anthropic_key";
const MODEL_KEY = "reading_app_anthropic_model";
const storyKey = (childId, week) => `reading_app_story_${childId}_${week}`;
const progressKey = (childId, week) => `reading_app_progress_${childId}_${week}`;

function fbRef(key) {
  if (!HAS_FB) return null;
  return firebase.database().ref(`families/${FAMILY_CODE}/reading/${key}`);
}

async function loadKey(key, fallback) {
  // Try Firebase first
  if (HAS_FB) {
    try {
      const snap = await fbRef(key).get();
      if (snap.exists()) {
        const v = snap.val();
        // We always write as JSON strings; tolerate raw values too.
        if (typeof v === "string") {
          try { return JSON.parse(v); } catch { return v; }
        }
        return v;
      }
    } catch (e) { /* network or auth issue, fall through */ }
  }
  // Then localStorage
  if (HAS_LS) {
    try {
      const raw = localStorage.getItem(key);
      if (raw != null) return JSON.parse(raw);
    } catch {}
  }
  // Then memory
  return MEM[key] !== undefined ? MEM[key] : fallback;
}

async function saveKey(key, value) {
  // Always write to localStorage first (instant, offline-safe)
  if (HAS_LS) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  MEM[key] = value;
  // Then fan out to Firebase (best effort)
  if (HAS_FB) {
    try { await fbRef(key).set(JSON.stringify(value)); } catch {}
  }
}

/* ============================ DATE HELPERS ============================ */
// ISO week: returns "2026-W22"
function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const weekNum = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return `${t.getUTCFullYear()}-W${String(weekNum).padStart(2, "0")}`;
}
function mondayOf(d = new Date()) {
  const x = new Date(d);
  const day = x.getDay() || 7;
  if (day !== 1) x.setHours(-24 * (day - 1));
  x.setHours(0, 0, 0, 0);
  return x;
}
function nextMonday(d = new Date()) {
  const m = mondayOf(d);
  m.setDate(m.getDate() + 7);
  return m;
}
function prettyDate(d) {
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}

/* ============================ CURRICULUM (advances by date) ============================ */
// UK academic year: Sept-Aug. Returns the appropriate band given today's date.
function bandForChild(child) {
  const now = new Date();
  const month = now.getMonth(); // 0=Jan, 11=Dec
  const year = now.getFullYear();
  // If we're in Sept-Dec, the academic year started this calendar year; otherwise last year.
  const academicYearStart = month >= 8 ? year : year - 1;

  if (child.id === "charlie") {
    // Charlie is Year 1 in academic year starting Sept 2025.
    const yearsAhead = academicYearStart - 2025;
    if (yearsAhead < 1) {
      // Year 1 (2025/26). Summer term = April–July.
      return "ort5";
    }
    if (yearsAhead === 1) {
      // Year 2 (2026/27). Autumn: ORT 6, Spring/Summer: ORT 7.
      return month >= 0 && month <= 3 ? "ort6" : month >= 8 ? "ort6" : "ort7";
    }
    if (yearsAhead === 2) {
      // Year 3 (2027/28).
      return month >= 3 && month <= 7 ? "ort9" : "ort8";
    }
    return "ort9";
  }

  // Freddie: pre-school 2025/26 → Reception Sept 2026 → Year 1 Sept 2027.
  const yearsAhead = academicYearStart - 2025;
  if (yearsAhead < 1) return "preschool";
  if (yearsAhead === 1) return "reception";
  if (yearsAhead === 2) return "ort5";
  return "ort6";
}

  ort8:       { name: "ORT Level 8", colour: "#3A86FF", label: "Purple Band · Year 2" },
  ort9:       { name: "ORT Level 9", colour: "#E63946", label: "Gold Band · Year 3" },
};

/* ============================ STORY GENERATION ============================ */
// Defines the chunks for each child. Each chunk is one API call.
// Page numbers and question types match the pedagogical schedule.
const CHUNKS_FOR = {
  charlie: [
    { pages: [1,2,3,4,5],     questions: { 4: "prediction" } },
    { pages: [6,7,8,9,10],    questions: { 7: "skimscan", 10: "retrieval" } },
    { pages: [11,12,13,14,15],questions: { 13: "inference" } },
    { pages: [16,17,18,19,20],questions: { 16: "prediction", 19: "retrieval" } },
  ],
  freddie: [
    { pages: [1,2,3,4,5],     questions: { 4: "retrieval" } },
    { pages: [6,7,8,9,10],    questions: { 7: "retrieval", 10: "retrieval" } },
    { pages: [11,12,13,14],   questions: { 13: "retrieval" } },
  ],
};

const QUESTION_GUIDE = {
  retrieval: "ask about a literal fact the reader can find in the text",
  prediction: "ask what might happen next, before the reader turns the page",
  skimscan: "ask the reader to find a specific word or detail on the page",
  inference: "ask why a character felt or did something, requiring reading between the lines",
};

// Line-based format is much more compact than JSON for repeated structures.
// Each chunk returns:
//   TITLE: ... (chunk 0 only)
//   SUB: ...   (chunk 0 only)
//   PAL: #hex,#hex,#hex   (chunk 0 only)
//   P4: <page text>
//   E4: emoji,emoji,emoji
//   Q4: <one-line JSON object for the question>
//   P5: ...
//   E5: ...
//   ... etc for each page in this chunk

function buildChunkPrompt(child, weekIso, chunkIdx, context) {
  const seedToken = `${child.id}-${weekIso}`;
  const chunks = CHUNKS_FOR[child.id];
  const chunk = chunks[chunkIdx];
  const isFirst = chunkIdx === 0;
  const isLast = chunkIdx === chunks.length - 1;
  const totalPages = chunks.reduce((s, c) => s + c.pages.length, 0);

  const band = bandForChild(child);
  const bandHints = {
    preschool: "Pre-school. ONE simple sentence per page using common short, decodable words (cat, dog, mum, dad, big, red, run, jump, see, look, go, in, on, up, down). Use repetition and rhythm where helpful.",
    reception: "Reception. 1-2 short sentences per page. Phase 2 and 3 phonics (s, a, t, p, i, n, m, d, g, o, c, k, ck, e, u, r, h, b, f, ff, l, ll, ss, j, v, w, x, y, z, zz, qu, ch, sh, th, ng, ai, ee, igh, oa, oo, ar, or, ur, ow, oi, ear, air, ure, er). Tricky words: the, to, I, no, go, into, he, she, we, me, be, was, my, you, they, all, are.",
    ort5: "Oxford Reading Tree Level 5 (Green Band). Year 1 Summer Term. 1-3 sentences per page, mix of dialogue and narration. Year 1 common exception words (said, your, there, where, school, were, friend, people, water, again). Phase 5 phonics: split digraphs and alternative spellings.",
    ort6: "Oxford Reading Tree Level 6 (Orange Band). 1-3 sentences. Adverbs and conjunctions (because, but, when, then). Past and present mixed.",
    ort7: "Oxford Reading Tree Level 7 (Turquoise Band). Year 2 Autumn. Multi-clause sentences, suffixes -er -est -ly, contractions.",
    ort8: "Oxford Reading Tree Level 8 (Purple Band). Year 2 Spring. Paragraphs of 3-4 sentences, expanded noun phrases, varied sentence openers.",
    ort9: "Oxford Reading Tree Level 9 (Gold Band). Year 3. Richer vocabulary, similes, dialogue.",
  };

  let header = isFirst
    ? `You are writing a brand-new ${child.id === "freddie" ? "pre-school picture book" : "Oxford Reading Tree-style storybook"} for ${child.id === "freddie" ? "a 4-year-old British boy named Freddie" : "a 6-year-old British boy named Charlie"}. UK English spelling. No em dashes.

Reading band: ${bandHints[band] || bandHints.ort5}

This is part ${chunkIdx + 1} of ${chunks.length} (the whole book is ${totalPages} pages).`
    : `You are continuing a ${child.id === "freddie" ? "pre-school picture book" : "Oxford Reading Tree-style storybook"}. UK English spelling. No em dashes.

This is part ${chunkIdx + 1} of ${chunks.length} (the whole book is ${totalPages} pages).

Story so far:
Title: "${context.title}"
Subtitle: "${context.subtitle}"
Palette: ${(context.palette || []).join(", ")}
Previous pages:
${context.previousTexts.map((t, i) => `  ${i+1}. ${t}`).join("\n")}
`;

  const pageLines = chunk.pages.map(n => {
    const qType = chunk.questions[n];
    let line = `  P${n}: <one or more short sentences, see band guidance>\n  E${n}: <3-6 emoji that capture this page, comma-separated>`;
    if (qType) {
      line += `\n  Q${n}: <ONE LINE of compact JSON: {"type":"${qType}","prompt":"...","options":["..","..",".."],"answer":"matches one option","hint":"one sentence about the skill"}>`;
    }
    return line;
  }).join("\n");

  const headerLinesIfFirst = isFirst
    ? `  TITLE: <book title, max ${child.id === "freddie" ? 6 : 7} words>
  SUB: <one short subtitle sentence>
  PAL: <3 hex colours like #2A9D8F,#E9C46A,#F4A261 that suit the story>
`
    : "";

  const guidanceLines = Object.entries(chunk.questions)
    .map(([page, type]) => `  Page ${page} question (${type}): ${QUESTION_GUIDE[type]}.`)
    .join("\n");

  const endingNote = isLast
    ? `\nThis is the final part. Page ${chunk.pages[chunk.pages.length - 1]} should give the story a satisfying ending.`
    : `\nDo NOT resolve the story yet. End this part on a hook.`;

  return `${header}

Output the chunk in this EXACT line-based format. No markdown, no commentary, just the lines below.

${headerLinesIfFirst}${pageLines}

Rules:
- Output exactly the pages listed above: ${chunk.pages.join(", ")}.
- Each P line is page text only. Each E line is emojis only. Each Q line is one-line JSON for the question.
- ${isFirst ? "Page 1 is the title page · text can be a 1-sentence opener, no question." : "Continue the same characters, tone and palette."}
${guidanceLines ? "- " + guidanceLines.trim().replace(/^  /, "") : ""}${endingNote}
- Random seed: "${seedToken}".

Output ONLY the lines above, nothing else.`;
}

function parseChunkResponse(text, chunk) {
  const lines = text.split(/\r?\n/);
  const out = { title: null, subtitle: null, palette: null, pages: [] };
  const pageMap = {}; // pageNum -> { text, emojis, question }

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    let m;
    if ((m = line.match(/^TITLE:\s*(.+)$/))) { out.title = m[1].replace(/^["']|["']$/g, ""); continue; }
    if ((m = line.match(/^SUB(?:TITLE)?:\s*(.+)$/))) { out.subtitle = m[1].replace(/^["']|["']$/g, ""); continue; }
    if ((m = line.match(/^PAL(?:ETTE)?:\s*(.+)$/))) {
      out.palette = m[1].split(",").map(s => s.trim()).filter(s => /^#?[0-9a-fA-F]{3,8}$/.test(s)).map(s => s.startsWith("#") ? s : "#" + s);
      continue;
    }
    if ((m = line.match(/^P(\d+):\s*(.+)$/))) {
      const n = parseInt(m[1], 10);
      pageMap[n] = pageMap[n] || {};
      pageMap[n].text = m[2].replace(/^["']|["']$/g, "");
      continue;
    }
    if ((m = line.match(/^E(\d+):\s*(.+)$/))) {
      const n = parseInt(m[1], 10);
      pageMap[n] = pageMap[n] || {};
      pageMap[n].emojis = m[2].trim();
      continue;
    }
    if ((m = line.match(/^Q(\d+):\s*(.+)$/))) {
      const n = parseInt(m[1], 10);
      pageMap[n] = pageMap[n] || {};
      let jsonStr = m[2].trim();
      // Strip any stray code fences or trailing chars
      jsonStr = jsonStr.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
      try { pageMap[n].question = JSON.parse(jsonStr); } catch (e) { /* drop malformed question */ }
      continue;
    }
  }

  // Assemble pages in the order the chunk expects
  for (const n of chunk.pages) {
    const p = pageMap[n] || {};
    out.pages.push({
      text: p.text || "",
      emojis: p.emojis || "",
      question: p.question || null,
    });
  }

  return out;
}

// API config is set in Settings and stored in Firebase + localStorage.
let ACTIVE_API_KEY = "";
let ACTIVE_MODEL = "claude-sonnet-4-5";
function setActiveApiKey(k) { ACTIVE_API_KEY = (k || "").trim(); }
function setActiveModel(m) { ACTIVE_MODEL = (m || "claude-sonnet-4-5").trim(); }

async function callChunkApi(prompt, chunk) {
  if (!ACTIVE_API_KEY) {
    throw new Error("No API key set. Open Settings and add your Anthropic API key.");
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": ACTIVE_API_KEY,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: ACTIVE_MODEL,
      max_tokens: 2048,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.text()).slice(0, 200); } catch (e) {}
    throw new Error(`API ${res.status}${detail ? `: ${detail}` : ""}`);
  }
  const data = await res.json();
  const text = (data.content || []).map(b => b.type === "text" ? b.text : "").join("");
  if (!text) throw new Error("Empty response");
  const parsed = parseChunkResponse(text, chunk);
  // Validate that we got text for every expected page
  const missing = parsed.pages.filter(p => !p.text).length;
  if (missing > Math.floor(chunk.pages.length / 3)) {
    throw new Error(`Got ${chunk.pages.length - missing}/${chunk.pages.length} pages`);
  }
  return parsed;
}

async function generateStory(child, weekIso, onProgress) {
  const chunks = CHUNKS_FOR[child.id];
  if (!chunks) throw new Error("Unknown child");

  let title = "", subtitle = "", palette = null;
  const allPages = [];

  for (let i = 0; i < chunks.length; i++) {
    const chunk = chunks[i];
    const context = i === 0 ? null : { title, subtitle, palette, previousTexts: allPages.map(p => p.text) };
    const prompt = buildChunkPrompt(child, weekIso, i, context);

    let lastErr;
    let result = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        onProgress && onProgress(
          attempt === 1
            ? `Writing part ${i + 1} of ${chunks.length}...`
            : `Retrying part ${i + 1} (${attempt}/3)...`
        );
        result = await callChunkApi(prompt, chunk);
        break;
      } catch (e) {
        lastErr = e;
        if (attempt < 3) await new Promise(r => setTimeout(r, 600 * attempt));
      }
    }
    if (!result) throw lastErr || new Error(`Could not generate part ${i + 1}`);

    if (i === 0) {
      title = result.title || "A New Story";
      subtitle = result.subtitle || "";
      palette = (result.palette && result.palette.length >= 2)
        ? result.palette
        : ["#2A9D8F", "#E9C46A", "#F4A261"];
    }
    for (const p of result.pages) allPages.push(p);
  }

  return {
    title,
    subtitle,
    palette,
    pages: allPages,
    generatedAt: new Date().toISOString(),
    week: weekIso,
    band: bandForChild(child),
  };
}

/* ============================ ILLUSTRATION ============================ */
// Render a scene from emojis + palette. Watercolour-style page art.
function SceneIllustration({ page, pageNumber, isCover, bookPalette }) {
  const palette = (page.palette && page.palette.length >= 2)
    ? page.palette
    : (bookPalette && bookPalette.length >= 2)
      ? bookPalette
      : ["#F4D58D", "#8DB1AB", "#E76F51"];
  const emojis = (page.emojis || "🌳,🐰,☁️")
    .split(",").map(s => s.trim()).filter(Boolean).slice(0, 6);

  // Deterministic positions based on page number so they don't reshuffle
  const seed = (pageNumber * 9301 + 49297) % 233280;
  const rand = (n) => {
    const x = Math.sin(seed * (n + 1)) * 10000;
    return x - Math.floor(x);
  };

  const positions = emojis.map((e, i) => {
    if (isCover) {
      // Cluster for cover
      const ang = (i / Math.max(1, emojis.length)) * Math.PI * 2;
      return {
        emoji: e,
        x: 50 + Math.cos(ang) * 22,
        y: 50 + Math.sin(ang) * 18,
        size: i === 0 ? 90 : 60 + rand(i) * 20,
        rot: (rand(i + 30) - 0.5) * 14,
      };
    }
    // Spread across full width; alternate top/bottom tiers
    const slots = emojis.length;
    const xBase = 10 + (i / Math.max(1, slots - 1 || 1)) * 80;
    const tier = i % 2 === 0 ? 38 : 62;
    return {
      emoji: e,
      x: xBase + (rand(i) - 0.5) * 6,
      y: tier + (rand(i + 7) - 0.5) * 12,
      size: 48 + rand(i + 20) * 26,
      rot: (rand(i + 30) - 0.5) * 14,
    };
  });

  const gradId = `g-${pageNumber}`;
  const blobId = `blob-${pageNumber}`;
  const paperId = `paper-${pageNumber}`;

  return (
    <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "100%", display: "block" }}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={palette[0]} stopOpacity="0.45" />
          <stop offset="100%" stopColor={palette[1] || palette[0]} stopOpacity="0.25" />
        </linearGradient>
        <radialGradient id={blobId} cx="50%" cy="50%" r="60%">
          <stop offset="0%" stopColor={palette[2] || palette[0]} stopOpacity="0.35" />
          <stop offset="100%" stopColor={palette[2] || palette[0]} stopOpacity="0" />
        </radialGradient>
        <filter id={paperId}>
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix values="0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.06 0"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>

      {/* Paper background */}
      <rect width="400" height="320" fill="#FBF6E9" />
      <rect width="400" height="320" fill={`url(#${gradId})`} />

      {/* Watercolour blobs */}
      <circle cx="80" cy="80" r="90" fill={`url(#${blobId})`} />
      <circle cx="320" cy="220" r="110" fill={`url(#${blobId})`} />
      <ellipse cx="200" cy="280" rx="180" ry="35" fill={palette[1] || palette[0]} fillOpacity="0.18" />

      {/* Horizon line / ground */}
      <path
        d="M 0 245 Q 100 235 200 248 T 400 245 L 400 320 L 0 320 Z"
        fill={palette[1] || "#B8C4A4"}
        fillOpacity="0.35"
      />

      {/* Scene elements (emojis) */}
      {positions.map((p, i) => (
        <text
          key={i}
          x={`${p.x}%`}
          y={`${p.y}%`}
          fontSize={p.size}
          textAnchor="middle"
          dominantBaseline="middle"
          transform={`rotate(${p.rot} ${(p.x / 100) * 400} ${(p.y / 100) * 320})`}
          style={{ filter: "drop-shadow(2px 3px 0 rgba(60,40,20,0.15))" }}
        >
          {p.emoji}
        </text>
      ))}

      {/* Paper grain */}
      <rect width="400" height="320" filter={`url(#${paperId})`} opacity="0.5" />
    </svg>
  );
}

/* ============================ TEXT-TO-SPEECH ============================ */
function useSpeech() {
  const [speaking, setSpeaking] = useState(false);
  const speak = useCallback((text) => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1.05;
    u.lang = "en-GB";
    // Try to pick a British voice
    const voices = window.speechSynthesis.getVoices();
    const british = voices.find(v => v.lang === "en-GB") || voices.find(v => v.lang?.startsWith("en"));
    if (british) u.voice = british;
    u.onstart = () => setSpeaking(true);
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    window.speechSynthesis.speak(u);
  }, []);
  const stop = useCallback(() => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setSpeaking(false);
  }, []);
  return { speak, stop, speaking };
}

/* ============================ MAIN APP ============================ */
function ReadingApp() {
  const [profiles, setProfiles] = useState(null);
  const [view, setView] = useState("home"); // home | reader | progress
  const [activeChild, setActiveChild] = useState(null);
  const [story, setStory] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadMsg, setLoadMsg] = useState("");
  const [error, setError] = useState(null);
  const [apiKey, setApiKey] = useState("");
  const [model, setModel] = useState("claude-sonnet-4-5");
  const [syncMode, setSyncMode] = useState(HAS_FB ? "synced" : "local");

  useEffect(() => {
    (async () => {
      const p = await loadKey(PROFILES_KEY, DEFAULT_PROFILES);
      setProfiles(p);
      const k = await loadKey(API_KEY_KEY, "");
      if (k) { setApiKey(k); setActiveApiKey(k); }
      const m = await loadKey(MODEL_KEY, "claude-sonnet-4-5");
      if (m) { setModel(m); setActiveModel(m); }
    })();
    // Warm up voices
    if (typeof window !== "undefined" && window.speechSynthesis) {
      window.speechSynthesis.getVoices();
    }
  }, []);

  const saveApiKey = useCallback(async (k) => {
    setApiKey(k);
    setActiveApiKey(k);
    await saveKey(API_KEY_KEY, k);
  }, []);
  const saveModel = useCallback(async (m) => {
    setModel(m);
    setActiveModel(m);
    await saveKey(MODEL_KEY, m);
  }, []);

  const saveProfiles = useCallback(async (next) => {
    setProfiles(next);
    await saveKey(PROFILES_KEY, next);
  }, []);

  const openChild = async (id) => {
    setActiveChild(id);
    setView("reader");
    setError(null);
    const child = profiles[id];
    const week = isoWeek();
    const key = storyKey(id, week);
    let cached = await loadKey(key, null);
    if (!cached) {
      setLoading(true);
      setLoadMsg("Looking for this week's story...");
      try {
        const s = await generateStory(child, week, (msg) => setLoadMsg(msg));
        await saveKey(key, s);
        cached = s;
      } catch (e) {
        const detail = (e && e.message) ? ` (${e.message})` : "";
        setError(`We couldn't write a new story right now. Try again in a moment.${detail}`);
        setLoading(false);
        return;
      }
      setLoading(false);
    }
    setStory(cached);
  };

  const awardCompletion = async (id, week) => {
    const next = { ...profiles };
    const p = { ...next[id] };
    // Avoid double-awarding if the same week has already been completed
    const alreadyAwarded = (p.collection || []).some(c => c.week === week);
    if (alreadyAwarded) return;
    p.storiesRead = (p.storiesRead || 0) + 1;
    const today = new Date().toISOString().slice(0, 10);
    if (p.lastDay !== today) {
      p.streak = (p.streak || 0) + 1;
      p.lastDay = today;
    }
    p.collection = [
      ...(p.collection || []),
      { id: week, emoji: critterFor(p, (p.collection || []).length), week },
    ];
    next[id] = p;
    await saveProfiles(next);
  };

  const backHome = () => {
    setView("home");
    setStory(null);
    setActiveChild(null);
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  };

  if (!profiles) {
    return (
      <div style={S.bootScreen}>
        <Loader2 size={42} className="spin" style={{ color: "#E76F51" }}/>
      </div>
    );
  }

  return (
    <div style={S.app}>
      <GoogleFontsAndCss />

      {view === "home" && (
        <Home
          profiles={profiles}
          hasApiKey={!!apiKey}
          syncMode={syncMode}
          onOpen={openChild}
          onProgress={(id) => { setActiveChild(id); setView("progress"); }}
          onSettings={() => setView("settings")}
        />
      )}

      {view === "settings" && (
        <SettingsView
          apiKey={apiKey}
          model={model}
          syncMode={syncMode}
          onSaveKey={saveApiKey}
          onSaveModel={saveModel}
          onBack={backHome}
        />
      )}

      {view === "reader" && (
        <Reader
          child={profiles[activeChild]}
          story={story}
          loading={loading}
          loadMsg={loadMsg}
          error={error}
          onBack={backHome}
          onProgressOpen={() => setView("progress")}
          onComplete={() => awardCompletion(activeChild, story?.week)}
          onRegenerate={async () => {
            const week = isoWeek();
            const key = storyKey(activeChild, week);
            setStory(null);
            setLoading(true);
            setLoadMsg("Writing a fresh story...");
            try {
              const s = await generateStory(profiles[activeChild], week, setLoadMsg);
              await saveKey(key, s);
              setStory(s);
            } catch (e) {
              const detail = (e && e.message) ? ` (${e.message})` : "";
              setError(`Couldn't generate. Try again.${detail}`);
            }
            setLoading(false);
          }}
        />
      )}

      {view === "progress" && (
        <Progress
          child={profiles[activeChild]}
          onBack={backHome}
        />
      )}
    </div>
  );
}
