const BUILDER_STARTERS = {"monsters":{"body":"m_b_green_blob","eyes":"m_e_two_small","mouth":"m_m_smile","top":"m_t_none"},"cars":{"body":"c_b_red_saloon","eyes":"c_e_round","mouth":"c_g_basic","top":"c_t_none"},"dinosaurs":{"body":"d_b_green_trex","eyes":"d_e_small","mouth":"d_m_smile","top":"d_t_none"},"lego":{"hair":"lg_hair_none","hat":"lg_hat_none","face":"lg_face_happy","shirtColour":"lg_shirt_red","legsColour":"lg_legs_blue","superhero":"lg_hero_none","animal":"lg_pet_none","gadget":"lg_gadget_none"}};
const BUILDER_CATS_LEGACY = [{"key":"body","label":"Body"},{"key":"eyes","label":"Eyes"},{"key":"mouth","label":"Mouth"},{"key":"top","label":"Top"}];
const BUILDER_CATS = {
  monsters: BUILDER_CATS_LEGACY, cars: BUILDER_CATS_LEGACY, dinosaurs: BUILDER_CATS_LEGACY,
  lego: [
    { key: "hair", label: "Hair" },
    { key: "hat", label: "Hat" },
    { key: "face", label: "Face" },
    { key: "shirtColour", label: "Shirt" },
    { key: "legsColour", label: "Legs" },
    { key: "superhero", label: "Cape" },
    { key: "animal", label: "Pet" },
    { key: "gadget", label: "Gadget" },
  ],
};
// Paint order (back to front) for compositing a character preview - separate from the tab
// display order above, since visual stacking doesn't always match the order parts are picked in.
const BUILDER_LAYER_ORDER = {
  monsters: ["body", "top", "eyes", "mouth"], cars: ["body", "top", "eyes", "mouth"], dinosaurs: ["body", "top", "eyes", "mouth"],
  lego: ["animal", "superhero", "legsColour", "shirtColour", "gadget", "face", "hair", "hat"],
};
// A fixed (non-equippable) SVG fragment spliced into the paint order right after a given
// layer - used for the lego head/neck, which every character has and isn't a pickable part.
const BUILDER_BASE = {
  lego: {
    afterLayer: "gadget",
    svg: '<rect x="86" y="72" width="28" height="14" fill="#FFD400" stroke="#000" stroke-width="2.5"/><rect x="71" y="14" width="58" height="62" rx="24" fill="#FFD400" stroke="#000" stroke-width="3.5"/>',
  },
};

// Return the equipped parts for a profile, falling back to starters for missing slots
function getEquipped(profile) {
  const themeId = profile.theme || "monsters";
  const starter = BUILDER_STARTERS[themeId] || BUILDER_STARTERS.monsters;
  const eq = profile.equipped || {};
  const result = {};
  for (const key of Object.keys(starter)) {
    result[key] = eq[key] || starter[key];
  }
  return result;
}

// Lookup a part by id across all themes
function findPart(partId) {
  for (const themeId of Object.keys(BUILDER_PARTS)) {
    for (const cat of Object.keys(BUILDER_PARTS[themeId])) {
      const item = BUILDER_PARTS[themeId][cat].find(x => x.id === partId);
      if (item) return { ...item, themeId, cat };
    }
  }
  return null;
}

// Render a character preview as SVG
function CharacterPreview({ profile, size = 160 }) {
  const equipped = getEquipped(profile);
  const themeId = profile.theme || "monsters";
  const parts = BUILDER_PARTS[themeId] || BUILDER_PARTS.monsters;
  const layerOrder = BUILDER_LAYER_ORDER[themeId] || ["body", "top", "eyes", "mouth"];
  const base = BUILDER_BASE[themeId];

  // Background colour shifts subtly per theme so the preview feels themed
  const bg = themeId === "cars" ? "#F0F4F8" : themeId === "dinosaurs" ? "#F0F7E8" : themeId === "lego" ? "#FBF6E9" : "#F4EEF7";

  // Composite each layer's equipped part in painter's-algorithm order (back to front),
  // splicing in the fixed base fragment (e.g. the lego head/neck) where it belongs.
  let inner = "";
  for (const layerKey of layerOrder) {
    const catParts = parts[layerKey] || [];
    const part = catParts.find(p => p.id === equipped[layerKey]);
    if (part && part.svg) inner += part.svg;
    if (base && base.afterLayer === layerKey) inner += base.svg;
  }

  return (
    <div style={{
      width: size, height: size,
      background: bg,
      borderRadius: 24,
      display: "grid", placeItems: "center",
      border: "3px solid #E5DDC9",
      boxShadow: "0 4px 12px rgba(20,50,50,0.08)",
    }}>
      <svg viewBox="0 0 200 200" width={size - 16} height={size - 16}
           dangerouslySetInnerHTML={{ __html: inner }} />
    </div>
  );
}

// Render just the parts SVG (no chrome) - used for grid thumbnails
function PartThumb({ part, size = 64 }) {
  // For non-body parts, we also draw a faint silhouette so the part has context
  let inner = part.svg;
  if (part.cat !== "body") {
    inner = '<circle cx="100" cy="120" r="55" fill="#E5DDC9" opacity="0.4"/>' + inner;
  }
  // For "Nothing" (empty) parts, show a dash
  if (!part.svg || part.svg.trim() === "") {
    return (
      <svg viewBox="0 0 200 200" width={size} height={size}>
        <circle cx="100" cy="120" r="50" fill="#F0EAD8" stroke="#C5B98F" strokeWidth="2" strokeDasharray="6,4"/>
        <text x="100" y="135" textAnchor="middle" fontSize="36" fill="#C5B98F" fontFamily="sans-serif">-</text>
      </svg>
    );
  }
  return (
    <svg viewBox="0 0 200 200" width={size} height={size}
         dangerouslySetInnerHTML={{ __html: inner }} />
  );
}

function CharacterBuilderView({ profile, data, setData, onBack }) {
  const themeId = profile.theme || "monsters";
  const themeParts = BUILDER_PARTS[themeId] || BUILDER_PARTS.monsters;
  const equipped = getEquipped(profile);
  const points = profile.points || 0;
  // unlocked is the master list of IDs the kid has bought. Starters are implicitly unlocked.
  const starterIds = Object.values(BUILDER_STARTERS[themeId] || {});
  const unlocked = (profile.unlocked && Array.isArray(profile.unlocked)) ? profile.unlocked : [];
  const isUnlocked = (id) => starterIds.includes(id) || unlocked.includes(id) || (profile.collection || []).includes(id);

  const [tab, setTab] = useState(() => ((BUILDER_CATS[themeId] || BUILDER_CATS.monsters)[0] || {}).key || "body");

  const buy = (part) => {
    if (isUnlocked(part.id)) return;
    if (points < part.price) return;
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: {
          ...profile,
          points: points - part.price,
          unlocked: [...unlocked, part.id],
          equipped: { ...equipped, [part.cat]: part.id },
        },
      },
    };
    setData(next);
  };

  const equip = (part) => {
    if (!isUnlocked(part.id)) return;
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: {
          ...profile,
          equipped: { ...equipped, [part.cat]: part.id },
        },
      },
    };
    setData(next);
  };

  // Active category parts, decorated with cat for findPart-like access
  const activeParts = (themeParts[tab] || []).map(p => ({ ...p, cat: tab }));

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Home</span></button>
      <div style={S.pageTitle}>Build Your {themeId === "cars" ? "Car" : themeId === "dinosaurs" ? "Dinosaur" : themeId === "lego" ? "Minifigure" : "Monster"}</div>

      <div style={S.builderHeader}>
        <CharacterPreview profile={profile} size={150} />
        <div style={S.builderStats}>
          <div style={S.collPointsBox}>
            <Star size={16} color="#D4A04A" />
            <span style={{ marginLeft: 6, fontWeight: 700, fontSize: 16 }}>{points}</span>
          </div>
          <div style={{ fontSize: 12, color: "#5C6F66", marginTop: 8, lineHeight: 1.4 }}>
            Mix and match parts to build your own character. Earn points by practising daily.
          </div>
        </div>
      </div>

      <div style={S.tabRow}>
        {(BUILDER_CATS[themeId] || BUILDER_CATS.monsters).map(c => (
          <button key={c.key} onClick={() => setTab(c.key)} style={{
            ...S.tabBtn,
            ...(tab === c.key ? S.tabBtnOn : {}),
          }}>{c.label}</button>
        ))}
      </div>

      <div style={S.partsGrid}>
        {activeParts.map(part => {
          const owned = isUnlocked(part.id);
          const isEquipped = equipped[part.cat] === part.id;
          const canAfford = points >= part.price;
          return (
            <div key={part.id} style={{
              ...S.partCard,
              ...(isEquipped ? S.partEquipped : {}),
              opacity: owned || canAfford ? 1 : 0.55,
            }}>
              <div style={S.partThumbBox}>
                <PartThumb part={part} size={70} />
              </div>
              <div style={S.partName}>{part.name}</div>
              {owned ? (
                <button
                  onClick={() => equip(part)}
                  style={{ ...S.collBtn, background: isEquipped ? "#143232" : "#E8EEEC", color: isEquipped ? "#fff" : "#143232" }}
                >
                  {isEquipped ? "Equipped" : "Equip"}
                </button>
              ) : (
                <button
                  onClick={() => buy(part)}
                  disabled={!canAfford}
                  style={{ ...S.collBtn, background: canAfford ? "#D4A04A" : "#E5DDC9", color: "#143232", cursor: canAfford ? "pointer" : "default" }}
                >
                  {canAfford ? <><Star size={11} color="#143232" /> <span style={{ marginLeft: 4 }}>{part.price}</span></> : <><Lock size={11} /> <span style={{ marginLeft: 4 }}>{part.price}</span></>}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CollectionView({ profile, data, setData, onBack }) {
  const theme = THEMES[profile.theme] || THEMES.monsters;
  const collection = profile.collection || [];
  const points = profile.points || 0;

  const buy = (item) => {
    if (collection.includes(item.id)) return;
    if (points < item.price) return;
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: {
          ...profile,
          points: points - item.price,
          collection: [...collection, item.id],
          favourite: profile.favourite || item.id,
        },
      },
    };
    setData(next);
  };

  const setFavourite = (id) => {
    if (!collection.includes(id)) return;
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: { ...profile, favourite: id },
      },
    };
    setData(next);
  };

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Home</span></button>
      <div style={S.pageTitle}>{theme.label} Collection</div>

      <div style={S.collHeader}>
        <div style={S.collPointsBox}>
          <Star size={16} color="#D4A04A" />
          <span style={{ marginLeft: 6, fontWeight: 700, fontSize: 16 }}>{points} points</span>
        </div>
        <div style={S.collStats}>{collection.length} of {theme.items.length} unlocked</div>
      </div>

      <div style={S.subTitle}>
        Earn points by practising. Tap to unlock new characters or pick your favourite.
      </div>

      <div style={S.collGrid}>
        {theme.items.map(item => {
          const owned = collection.includes(item.id);
          const isFav = profile.favourite === item.id;
          const canAfford = points >= item.price;
          return (
            <div key={item.id} style={{
              ...S.collCard,
              ...(isFav ? S.collFav : {}),
              opacity: owned || canAfford ? 1 : 0.55,
            }}>
              <div style={{ fontSize: 44, lineHeight: 1 }}>{owned ? item.emoji : "❓"}</div>
              <div style={S.collName}>{owned ? item.name : "Locked"}</div>
              {owned ? (
                <button
                  onClick={() => setFavourite(item.id)}
                  style={{ ...S.collBtn, background: isFav ? "#143232" : "transparent", color: isFav ? "#fff" : "#143232" }}
                >
                  {isFav ? "Favourite" : "Pick"}
                </button>
              ) : (
                <button
                  onClick={() => buy(item)}
                  disabled={!canAfford}
                  style={{ ...S.collBtn, background: canAfford ? "#D4A04A" : "#E5DDC9", color: "#143232", cursor: canAfford ? "pointer" : "default" }}
                >
                  {canAfford ? <><Star size={11} color="#143232" /> <span style={{ marginLeft: 4 }}>{item.price}</span></> : <><Lock size={11} /> <span style={{ marginLeft: 4 }}>{item.price}</span></>}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================ SETTINGS ============================ */
function useAuthStatus() {
  const [status, setStatus] = useState(window._authStatus || { state: "checking" });
  useEffect(() => {
    const onChange = () => setStatus({ ...window._authStatus });
    onChange();
    window.addEventListener("english-minutes-auth-changed", onChange);
    return () => window.removeEventListener("english-minutes-auth-changed", onChange);
  }, []);
  return status;
}

function GoogleSignInCard() {
  const status = useAuthStatus();
  return (
    <div style={{ ...S.insightCard, marginTop: 8 }}>
      <div style={{ fontSize: 14, fontWeight: 700, color: "#143232", marginBottom: 6 }}>
        <Lock size={14} /> <span style={{ marginLeft: 6 }}>Family sign-in</span>
      </div>
      {status.state === "signed-in" ? (
        <>
          <div style={{ fontSize: 12, color: "#5a6b5f", marginBottom: 10, lineHeight: 1.4 }}>
            Signed in as <strong>{status.detail}</strong>. Progress syncs across devices for this account.
          </div>
          <button onClick={() => window._signOutOfGoogle()} style={{ ...S.backupBtn, background: "#264653" }}>Sign out</button>
        </>
      ) : status.state === "denied" ? (
        <>
          <div style={{ fontSize: 12, color: "#9b3a1f", marginBottom: 10, lineHeight: 1.4 }}>
            Signed in as <strong>{status.detail}</strong>, but this Google account isn't one of the family accounts allowed to sync this data.
          </div>
          <button onClick={() => window._signOutOfGoogle()} style={{ ...S.backupBtn, background: "#264653" }}>Sign out</button>
        </>
      ) : (
        <>
          <div style={{ fontSize: 12, color: status.state === "error" ? "#9b3a1f" : "#5a6b5f", marginBottom: 10, lineHeight: 1.4 }}>
            {status.state === "checking"
              ? "Checking sign-in..."
              : status.state === "error"
              ? `Sign-in failed: ${status.detail}`
              : "Sign in with a family Google account to sync progress across devices."}
          </div>
          <button onClick={() => window._signInWithGoogle()} style={S.backupBtn}>Sign in with Google</button>
        </>
      )}
    </div>
  );
}

function SyncStatusCard({ data }) {
  const [tick, setTick] = useState(0);
  const [syncing, setSyncing] = useState(false);
  const [now, setNow] = useState(new Date());

  // Re-render every 15s so "X minutes ago" stays fresh
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 15000);
    return () => clearInterval(id);
  }, []);

  const syncNow = async () => {
    if (typeof window._forceSyncNow !== "function") return;
    setSyncing(true);
    try { await window._forceSyncNow(); } catch (e) {}
    setSyncing(false);
    setTick(t => t + 1); // force re-read of window._lastSyncedAt
  };

  // Read connection state and last-sync from window (set by the App component)
  const connected = !!window._fbConnected;
  const lastSync = window._lastSyncedAt instanceof Date ? window._lastSyncedAt : null;

  let agoText = "never";
  if (lastSync) {
    const ms = now - lastSync;
    if (ms < 5000) agoText = "just now";
    else if (ms < 60000) agoText = `${Math.round(ms/1000)}s ago`;
    else if (ms < 3600000) agoText = `${Math.round(ms/60000)} min ago`;
    else agoText = lastSync.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  return (
    <div style={{ ...S.insightCard, marginTop: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#143232", marginBottom: 4 }}>
            {connected ? "🟢 Sync on" : "🔴 Sync off"}
          </div>
          <div style={{ fontSize: 12, color: "#5a6b5f", lineHeight: 1.4 }}>
            {connected
              ? `Last update: ${agoText}. The boys' progress syncs automatically between phones.`
              : `Not connected to the cloud right now. Your changes will sync when you have signal again.`}
          </div>
        </div>
        <button onClick={syncNow} disabled={syncing} style={{
          ...S.backupBtn,
          background: syncing ? "#7a8b80" : "#143232",
          fontSize: 12, padding: "8px 12px", flexShrink: 0,
        }}>
          {syncing ? "Syncing..." : "🔄 Sync now"}
        </button>
      </div>
    </div>
  );
}

function CloudBackupsCard({ data, setData }) {
  const [backups, setBackups] = useState(null);
  const [loading, setLoading] = useState(false);

  const refresh = async () => {
    setLoading(true);
    try {
      const list = await listBackups();
      setBackups(list);
    } catch (e) {
      console.warn("Backup list failed:", e);
      setBackups([]);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { refresh(); }, []);

  const restoreFrom = (backup) => {
    const dateStr = new Date(backup.savedAt).toLocaleString("en-GB", {
      day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
    if (!window.confirm(`Restore data from backup taken ${dateStr}? Current data will be replaced.`)) return;
    allowResetOnce();
    setData(mergeWithDefault(backup.data));
    alert("Restored. The app will refresh to show the restored data.");
  };

  return (
    <>
      <div style={S.sectionTitle}>Cloud backups</div>
      <div style={{ ...S.insightCard, marginTop: 8 }}>
        <div style={{ fontSize: 12, color: "#7a8b80", marginBottom: 10, lineHeight: 1.4 }}>
          A snapshot is saved automatically each day. Up to 30 days are kept. Tap a date to restore.
        </div>
        {loading && <div style={{ fontSize: 13, color: "#5a6b5f" }}>Loading backups...</div>}
        {!loading && backups && backups.length === 0 && (
          <div style={{ fontSize: 13, color: "#5a6b5f", fontStyle: "italic" }}>
            No cloud backups yet. The first one is created automatically when your next session saves.
          </div>
        )}
        {!loading && backups && backups.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
            {backups.map(b => {
              // Sum up total points and days across all profiles for a quick preview
              const profiles = (b.data && b.data.profiles) || {};
              const summary = Object.values(profiles).map(p => {
                const pts = p.points || 0;
                const days = Object.keys(p.days || {}).length;
                return `${p.name || p.id}: ${pts} pts, ${days} days`;
              }).join(" · ");
              const friendlyDate = new Date(b.savedAt).toLocaleDateString("en-GB", {
                weekday: "short", day: "numeric", month: "short",
              });
              return (
                <button key={b.date} onClick={() => restoreFrom(b)} style={S.backupRow}>
                  <div style={{ fontWeight: 700, fontSize: 13, color: "#143232" }}>{friendlyDate}</div>
                  <div style={{ fontSize: 11, color: "#5a6b5f", marginTop: 2 }}>{summary || "Empty backup"}</div>
                </button>
              );
            })}
          </div>
        )}
        <button onClick={refresh} style={{ ...S.backupBtn, marginTop: 10, background: "#E5DDC9", color: "#143232" }}>
          🔄 Refresh list
        </button>
      </div>
    </>
  );
}

function PhonicsSettingsView({ profile, data, setData, onBack }) {
  const [britishVoices, setBritishVoices] = useState([]);

  useEffect(() => {
    const refresh = () => setBritishVoices(listBritishVoices());
    refresh();
    if (typeof window !== "undefined" && window.speechSynthesis) {
      window.speechSynthesis.addEventListener?.("voiceschanged", refresh);
      return () => window.speechSynthesis.removeEventListener?.("voiceschanged", refresh);
    }
  }, []);

  const setTheme = (theme) => {
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: { ...profile, theme, favourite: null },
      },
    };
    setData(next);
  };
  const setYear = (year) => {
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: { ...profile, year },
      },
    };
    setData(next);
  };
  const reset = () => {
    if (!window.confirm(`Reset all progress for ${profile.name}? This cannot be undone.`)) return;
    allowResetOnce(); // signal to the guard that this wipe is intentional
    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: newProfile(profile.id, profile.name, profile.year, profile.theme, profile.yearStart),
      },
    };
    setData(next);
  };

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Home</span></button>
      <div style={S.pageTitle}>Settings · {profile.name}</div>

      <div style={S.sectionTitle}>Reward theme</div>
      <div style={S.themeRow}>
        {Object.entries(THEMES).map(([k, t]) => (
          <button key={k} onClick={() => setTheme(k)} style={{ ...S.themeBtn, ...(profile.theme === k ? S.themeBtnOn : {}) }}>
            <div style={{ fontSize: 32 }}>{t.emoji}</div>
            <div style={{ fontWeight: 600, marginTop: 4 }}>{t.label}</div>
          </button>
        ))}
      </div>

      <div style={S.sectionTitle}>Year group (automatic)</div>
      <div style={{ ...S.insightCard, marginTop: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <BookOpen size={20} color="#143232" />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 16, color: "#143232" }}>{getLevelLabel(getCurrentLevel(profile))}</div>
            <div style={{ fontSize: 12, color: "#5a6b5f", marginTop: 2 }}>
              {profile.yearStart
                ? `Year 1 academic year ${profile.yearStart}/${(profile.yearStart + 1).toString().slice(2)}. Auto-progresses each September.`
                : "No academic cohort set. Auto-progression disabled."}
            </div>
          </div>
        </div>
      </div>

      <div style={S.sectionTitle}>Reading voice</div>
      <div style={{ ...S.insightCard, marginTop: 8 }}>
        {britishVoices.length === 0 ? (
          <div style={{ fontSize: 13, color: "#5a6b5f" }}>
            No British voices found on this device. Try installing an "English (United Kingdom)" voice in your phone's accessibility or language settings, then reload the app.
          </div>
        ) : (
          <>
            <div style={{ fontSize: 13, color: "#5a6b5f", marginBottom: 8 }}>Pick a voice from those installed on this device:</div>
            <select
              value={data.voiceName || ""}
              onChange={(e) => setData({ ...data, voiceName: e.target.value || null })}
              style={S.select}
            >
              <option value="">Auto (best British voice)</option>
              {britishVoices.map(v => (
                <option key={v.name} value={v.name}>{v.name}</option>
              ))}
            </select>
            <button onClick={() => speak("Hello! Let's practise some English together.")} style={{ ...S.testVoiceBtn, marginTop: 10 }}>
              <Volume2 size={14} /> <span style={{ marginLeft: 6 }}>Test voice</span>
            </button>
          </>
        )}
      </div>

      <div style={S.sectionTitle}>Backup & sync</div>
      <GoogleSignInCard />
      <SyncStatusCard data={data} />
      <div style={{ ...S.insightCard, marginTop: 8 }}>
        <div style={{ fontSize: 12, color: "#7a8b80", marginBottom: 12, lineHeight: 1.4 }}>
          Manual backup file - download to your phone for extra safety.
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => {
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `english-minutes-backup-${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }} style={S.backupBtn}>📥 Download backup</button>

          <label style={{ ...S.backupBtn, cursor: "pointer" }}>
            📤 Restore from backup
            <input type="file" accept="application/json,.json" style={{ display: "none" }} onChange={(e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (ev) => {
                try {
                  const parsed = JSON.parse(ev.target.result);
                  if (!parsed.profiles) {
                    alert("That doesn't look like a valid backup file.");
                    return;
                  }
                  const confirmed = confirm("This will replace all current progress with the backup. Continue?");
                  if (!confirmed) return;
                  allowResetOnce(); // restoring may have fewer days than current, allow it
                  setData(mergeWithDefault(parsed));
                  alert("Backup restored!");
                } catch (err) {
                  alert("Could not read that file: " + err.message);
                }
              };
              reader.readAsText(file);
              // reset the input so the same file can be picked again
              e.target.value = "";
            }} />
          </label>
        </div>
      </div>

      <CloudBackupsCard data={data} setData={setData} />

      <div style={S.sectionTitle}>Term</div>
      <div style={{ ...S.insightCard, marginTop: 8 }}>
        <div style={{ fontSize: 14, color: "#5a6b5f" }}>The questions get harder through the year:</div>
        <div style={{ marginTop: 8, fontSize: 14 }}>
          <strong>Autumn</strong>: introduces phonics and the first batch of tricky words.<br />
          <strong>Spring</strong>: adds plurals, "-ing", question marks and more tricky words.<br />
          <strong>Summer</strong>: adds "-ed", "un-", "!", grammar and word classes.
        </div>
        <div style={{ marginTop: 8, fontSize: 13, color: "#5a6b5f" }}>Currently: <strong>{ {autumn: "Autumn", spring: "Spring", summer: "Summer"}[getTerm()] } term</strong> (auto-detected from today's date).</div>
      </div>

      <div style={{ marginTop: 24 }}>
        <button onClick={reset} style={S.resetBtn}>Reset {profile.name}'s progress</button>
      </div>
    </div>
  );
}

/* ============================ STORAGE ============================ */
// Cross-device storage: Firebase Realtime Database (primary) with localStorage fallback.
// FIREBASE_CONFIG and FAMILY_CODE are defined in the HTML scaffold.
// A function (not a one-off const) so it reflects live sign-in state - gated on being signed
// in as an allowed family Google account, not just on the family code being known (the code
// alone isn't real access control; see Maths Minutes).
const hasFB = () => typeof firebase !== "undefined" && typeof FAMILY_CODE !== "undefined" && window._authAllowed === true;
const HAS_LS = typeof localStorage !== "undefined";
const MEM = {};
const PROFILES_KEY = "reading_app_profiles_v1";
const API_KEY_KEY = "reading_app_anthropic_key";
const MODEL_KEY = "reading_app_anthropic_model";
const storyKey = (childId, week) => `reading_app_story_${childId}_${week}`;
const progressKey = (childId, week) => `reading_app_progress_${childId}_${week}`;

function fbRef(key) {
  if (!hasFB()) return null;
  return firebase.database().ref(`families/${FAMILY_CODE}/reading/${key}`);
}

async function loadKey(key, fallback) {
  // Try Firebase first
  if (hasFB()) {
    try {
      const snap = await fbRef(key).get();
      if (snap.exists()) {
        const v = snap.val();
        // We always write as JSON strings; tolerate raw values too.
        if (typeof v === "string") {
          try { return JSON.parse(v); } catch { return v; }
        }
        return v;
      }
    } catch (e) { /* network or auth issue, fall through */ }
  }
  // Then localStorage
  if (HAS_LS) {
    try {
      const raw = localStorage.getItem(key);
      if (raw != null) return JSON.parse(raw);
    } catch {}
  }
  // Then memory
  return MEM[key] !== undefined ? MEM[key] : fallback;
}

async function saveKey(key, value) {
  // Always write to localStorage first (instant, offline-safe)
  if (HAS_LS) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  MEM[key] = value;
  // Then fan out to Firebase (best effort)
  if (hasFB()) {
    try { await fbRef(key).set(JSON.stringify(value)); } catch {}
  }
}

/* ============================ DATE HELPERS ============================ */
// ISO week: returns "2026-W22"
function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const weekNum = Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  return `${t.getUTCFullYear()}-W${String(weekNum).padStart(2, "0")}`;
}
function mondayOf(d = new Date()) {
  const x = new Date(d);
  const day = x.getDay() || 7;
  if (day !== 1) x.setHours(-24 * (day - 1));
  x.setHours(0, 0, 0, 0);
  return x;
}
function nextMonday(d = new Date()) {
  const m = mondayOf(d);
  m.setDate(m.getDate() + 7);
  return m;
}
function prettyDate(d) {
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}
// Reverse of isoWeek() - turns "2026-W32" back into the Monday of that ISO week, for
// displaying a friendly date on library entries.
function mondayOfIsoWeek(weekStr) {
  const [yearStr, wStr] = String(weekStr).split("-W");
  const year = parseInt(yearStr, 10);
  const week = parseInt(wStr, 10);
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;
  const week1Monday = new Date(jan4);
  week1Monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1);
  const target = new Date(week1Monday);
  target.setUTCDate(week1Monday.getUTCDate() + (week - 1) * 7);
  return target;
}

// UK academic year: Sept-Aug. Returns the appropriate band given today's date.
function bandForChild(child) {
  const now = new Date();
  const month = now.getMonth(); // 0=Jan, 11=Dec
  const year = now.getFullYear();
  // If we're in Sept-Dec, the academic year started this calendar year; otherwise last year.
  const academicYearStart = month >= 8 ? year : year - 1;

  if (child.id === "charlie") {
    // Charlie is Year 1 in academic year starting Sept 2025.
    const yearsAhead = academicYearStart - 2025;
    if (yearsAhead < 1) {
      // Year 1 (2025/26). Summer term = April–July.
      return "ort5";
    }
    if (yearsAhead === 1) {
      // Year 2 (2026/27). Autumn: ORT 6, Spring/Summer: ORT 7.
      return month >= 0 && month <= 3 ? "ort6" : month >= 8 ? "ort6" : "ort7";
    }
    if (yearsAhead === 2) {
      // Year 3 (2027/28).
      return month >= 3 && month <= 7 ? "ort9" : "ort8";
    }
    return "ort9";
  }

  // Freddie: pre-school 2025/26 → Reception Sept 2026 → Year 1 Sept 2027.
  const yearsAhead = academicYearStart - 2025;
  if (yearsAhead < 1) return "preschool";
  if (yearsAhead === 1) return "reception";
  if (yearsAhead === 2) return "ort5";
  return "ort6";
}

// Pick story for a given week. We use a stable hash of the week string so the choice
// is consistent for the family, and incrementing the week index naturally cycles forwards.
function pickStoryFromLibrary(child, weekIso) {
  const lib = STORY_LIBRARY[child.id];
  if (!lib || !lib.length) return null;
  // Parse "2026-W23" → 23
  const m = weekIso.match(/^(\d+)-W(\d+)$/);
  if (!m) return lib[0];
  const year = parseInt(m[1], 10);
  const week = parseInt(m[2], 10);
  // 53 weeks max per year; combined index ensures forward progression across year boundary
  const idx = (year * 53 + week) % lib.length;
  const story = lib[idx];
  return {
    title: story.title,
    subtitle: story.subtitle,
    palette: story.palette.slice(),
    pages: story.pages.map(p => ({ ...p, question: p.question ? { ...p.question } : null })),
    generatedAt: new Date().toISOString(),
    week: weekIso,
    band: bandForChild(child),
    fromLibrary: true,
  };
}

// Defines the chunks for each child. Each chunk is one API call.
// Page numbers and question types match the pedagogical schedule.
const CHUNKS_FOR = {
  charlie: [
    { pages: [1,2,3,4,5],     questions: { 4: "prediction" } },
    { pages: [6,7,8,9,10],    questions: { 7: "skimscan", 10: "retrieval" } },
    { pages: [11,12,13,14,15],questions: { 13: "inference" } },
    { pages: [16,17,18,19,20],questions: { 16: "prediction", 19: "retrieval" } },
  ],
  freddie: [
    { pages: [1,2,3,4,5],     questions: { 4: "retrieval" } },
    { pages: [6,7,8,9,10],    questions: { 7: "retrieval", 10: "retrieval" } },
    { pages: [11,12,13,14],   questions: { 13: "retrieval" } },
  ],
};

const QUESTION_GUIDE = {
  retrieval: "ask about a literal fact the reader can find in the text",
  prediction: "ask what might happen next, before the reader turns the page",
  skimscan: "ask the reader to find a specific word or detail on the page",
  inference: "ask why a character felt or did something, requiring reading between the lines",
};

// Line-based format is much more compact than JSON for repeated structures.
// Each chunk returns:
//   TITLE: ... (chunk 0 only)
//   SUB: ...   (chunk 0 only)
//   PAL: #hex,#hex,#hex   (chunk 0 only)
//   P4: <page text>
//   E4: emoji,emoji,emoji
//   Q4: <one-line JSON object for the question>
//   P5: ...
//   E5: ...
//   ... etc for each page in this chunk

function buildChunkPrompt(child, weekIso, chunkIdx, context) {
  const seedToken = `${child.id}-${weekIso}`;
  const chunks = CHUNKS_FOR[child.id];
  const chunk = chunks[chunkIdx];
  const isFirst = chunkIdx === 0;
  const isLast = chunkIdx === chunks.length - 1;
  const totalPages = chunks.reduce((s, c) => s + c.pages.length, 0);

  const band = bandForChild(child);
  const bandHints = {
    preschool: "Pre-school. ONE simple sentence per page using common short, decodable words (cat, dog, mum, dad, big, red, run, jump, see, look, go, in, on, up, down). Use repetition and rhythm where helpful.",
    reception: "Reception. 1-2 short sentences per page. Phase 2 and 3 phonics (s, a, t, p, i, n, m, d, g, o, c, k, ck, e, u, r, h, b, f, ff, l, ll, ss, j, v, w, x, y, z, zz, qu, ch, sh, th, ng, ai, ee, igh, oa, oo, ar, or, ur, ow, oi, ear, air, ure, er). Tricky words: the, to, I, no, go, into, he, she, we, me, be, was, my, you, they, all, are.",
    ort5: "Oxford Reading Tree Level 5 (Green Band). Year 1 Summer Term. 1-3 sentences per page, mix of dialogue and narration. Year 1 common exception words (said, your, there, where, school, were, friend, people, water, again). Phase 5 phonics: split digraphs and alternative spellings.",
    ort6: "Oxford Reading Tree Level 6 (Orange Band). 1-3 sentences. Adverbs and conjunctions (because, but, when, then). Past and present mixed.",
    ort7: "Oxford Reading Tree Level 7 (Turquoise Band). Year 2 Autumn. Multi-clause sentences, suffixes -er -est -ly, contractions.",
    ort8: "Oxford Reading Tree Level 8 (Purple Band). Year 2 Spring. Paragraphs of 3-4 sentences, expanded noun phrases, varied sentence openers.",
    ort9: "Oxford Reading Tree Level 9 (Gold Band). Year 3. Richer vocabulary, similes, dialogue.",
  };

  let header = isFirst
    ? `You are writing a brand-new ${child.id === "freddie" ? "pre-school picture book" : "Oxford Reading Tree-style storybook"} for ${child.id === "freddie" ? "a 4-year-old British boy named Freddie" : "a 6-year-old British boy named Charlie"}. UK English spelling. No em dashes.

Reading band: ${bandHints[band] || bandHints.ort5}

This is part ${chunkIdx + 1} of ${chunks.length} (the whole book is ${totalPages} pages).`
    : `You are continuing a ${child.id === "freddie" ? "pre-school picture book" : "Oxford Reading Tree-style storybook"}. UK English spelling. No em dashes.

This is part ${chunkIdx + 1} of ${chunks.length} (the whole book is ${totalPages} pages).

Story so far:
Title: "${context.title}"
Subtitle: "${context.subtitle}"
Palette: ${(context.palette || []).join(", ")}
Previous pages:
${context.previousTexts.map((t, i) => `  ${i+1}. ${t}`).join("\n")}
`;

  const pageLines = chunk.pages.map(n => {
    const qType = chunk.questions[n];
    let line = `  P${n}: <one or more short sentences, see band guidance>\n  E${n}: <3-6 emoji that capture this page, comma-separated>`;
    if (qType) {
      line += `\n  Q${n}: <ONE LINE of compact JSON: {"type":"${qType}","prompt":"...","options":["..","..",".."],"answer":"matches one option","hint":"one sentence about the skill"}>`;
    }
    return line;
  }).join("\n");

  const headerLinesIfFirst = isFirst
    ? `  TITLE: <book title, max ${child.id === "freddie" ? 6 : 7} words>
  SUB: <one short subtitle sentence>
  PAL: <3 hex colours like #2A9D8F,#E9C46A,#F4A261 that suit the story>
`
    : "";

  const guidanceLines = Object.entries(chunk.questions)
    .map(([page, type]) => `  Page ${page} question (${type}): ${QUESTION_GUIDE[type]}.`)
    .join("\n");

  const endingNote = isLast
    ? `\nThis is the final part. Page ${chunk.pages[chunk.pages.length - 1]} should give the story a satisfying ending.`
    : `\nDo NOT resolve the story yet. End this part on a hook.`;

  return `${header}

Output the chunk in this EXACT line-based format. No markdown, no commentary, just the lines below.

${headerLinesIfFirst}${pageLines}

Rules:
- Output exactly the pages listed above: ${chunk.pages.join(", ")}.
- Each P line is page text only. Each E line is emojis only. Each Q line is one-line JSON for the question.
- ${isFirst ? "Page 1 is the title page · text can be a 1-sentence opener, no question." : "Continue the same characters, tone and palette."}
${guidanceLines ? "- " + guidanceLines.trim().replace(/^  /, "") : ""}${endingNote}
- Random seed: "${seedToken}".

Output ONLY the lines above, nothing else.`;
}

function parseChunkResponse(text, chunk) {
  const lines = text.split(/\r?\n/);
  const out = { title: null, subtitle: null, palette: null, pages: [] };
  const pageMap = {}; // pageNum -> { text, emojis, question }

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    let m;
    if ((m = line.match(/^TITLE:\s*(.+)$/))) { out.title = m[1].replace(/^["']|["']$/g, ""); continue; }
    if ((m = line.match(/^SUB(?:TITLE)?:\s*(.+)$/))) { out.subtitle = m[1].replace(/^["']|["']$/g, ""); continue; }
    if ((m = line.match(/^PAL(?:ETTE)?:\s*(.+)$/))) {
      out.palette = m[1].split(",").map(s => s.trim()).filter(s => /^#?[0-9a-fA-F]{3,8}$/.test(s)).map(s => s.startsWith("#") ? s : "#" + s);
      continue;
    }
    if ((m = line.match(/^P(\d+):\s*(.+)$/))) {
      const n = parseInt(m[1], 10);
      pageMap[n] = pageMap[n] || {};
      pageMap[n].text = m[2].replace(/^["']|["']$/g, "");
      continue;
    }
    if ((m = line.match(/^E(\d+):\s*(.+)$/))) {
      const n = parseInt(m[1], 10);
      pageMap[n] = pageMap[n] || {};
      pageMap[n].emojis = m[2].trim();
      continue;
    }
    if ((m = line.match(/^Q(\d+):\s*(.+)$/))) {
      const n = parseInt(m[1], 10);
      pageMap[n] = pageMap[n] || {};
      let jsonStr = m[2].trim();
      // Strip any stray code fences or trailing chars
      jsonStr = jsonStr.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
      try { pageMap[n].question = JSON.parse(jsonStr); } catch (e) { /* drop malformed question */ }
      continue;
    }
  }

  // Assemble pages in the order the chunk expects
  for (const n of chunk.pages) {
    const p = pageMap[n] || {};
    out.pages.push({
      text: p.text || "",
      emojis: p.emojis || "",
      question: p.question || null,
    });
  }

  return out;
}

// API config: the app calls the Anthropic API directly from the browser using a
// user-supplied key entered in Settings (this is a static GitHub Pages site, so there's
// no server-side proxy/function fronting the request).
let ACTIVE_API_KEY = "";
let ACTIVE_MODEL = "claude-sonnet-4-5";
function setActiveApiKey(k) { ACTIVE_API_KEY = (k || "").trim(); }
function setActiveModel(m) { ACTIVE_MODEL = (m || "claude-sonnet-4-5").trim(); }

async function callChunkApi(prompt, chunk) {
  if (!ACTIVE_API_KEY) {
    throw new Error("Add your Anthropic API key in Settings to generate stories.");
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": ACTIVE_API_KEY,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: ACTIVE_MODEL,
      max_tokens: 2048,
      messages: [{ role: "user", content: prompt }],
    }),
  });

  if (!res.ok) {
    let detail = "";
    try { detail = (await res.text()).slice(0, 200); } catch (e) {}
    throw new Error(`API ${res.status}${detail ? `: ${detail}` : ""}`);
  }
  const data = await res.json();
  const text = (data.content || []).map(b => b.type === "text" ? b.text : "").join("");
  if (!text) throw new Error("Empty response");
  const parsed = parseChunkResponse(text, chunk);
  // Validate that we got text for every expected page
  const missing = parsed.pages.filter(p => !p.text).length;
  if (missing > Math.floor(chunk.pages.length / 3)) {
    throw new Error(`Got ${chunk.pages.length - missing}/${chunk.pages.length} pages`);
  }
  return parsed;
}

async function generateStoryFromLibrary(child, weekIso, onProgress) {
  if (onProgress) onProgress("Loading this week's story...");
  await new Promise(r => setTimeout(r, 200)); // tiny delay so the loading UI is visible
  const story = pickStoryFromLibrary(child, weekIso);
  if (!story) throw new Error("No stories available for " + child.id);
  return story;
}

// Legacy AI-driven story generator. Kept as a backup path but not used by default.
async function _aiGenerateStory(child, weekIso, onProgress) {
  const chunks = CHUNKS_FOR[child.id];
  if (!chunks) throw new Error("Unknown child");

  let title = "", subtitle = "", palette = null;
  const allPages = [];

  for (let i = 0; i < chunks.length; i++) {
    const chunk = chunks[i];
    const context = i === 0 ? null : { title, subtitle, palette, previousTexts: allPages.map(p => p.text) };
    const prompt = buildChunkPrompt(child, weekIso, i, context);

    let lastErr;
    let result = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        onProgress && onProgress(
          attempt === 1
            ? `Writing part ${i + 1} of ${chunks.length}...`
            : `Retrying part ${i + 1} (${attempt}/3)...`
        );
        result = await callChunkApi(prompt, chunk);
        break;
      } catch (e) {
        lastErr = e;
        if (attempt < 3) await new Promise(r => setTimeout(r, 600 * attempt));
      }
    }
    if (!result) throw lastErr || new Error(`Could not generate part ${i + 1}`);

    if (i === 0) {
      title = result.title || "A New Story";
      subtitle = result.subtitle || "";
      palette = (result.palette && result.palette.length >= 2)
        ? result.palette
        : ["#2A9D8F", "#E9C46A", "#F4A261"];
    }
    for (const p of result.pages) allPages.push(p);
  }

  return {
    title,
    subtitle,
    palette,
    pages: allPages,
    generatedAt: new Date().toISOString(),
    week: weekIso,
    band: bandForChild(child),
  };
}

// Render a scene from emojis + palette. Watercolour-style page art.
function SceneIllustration({ page, pageNumber, isCover, bookPalette }) {
  const palette = (page.palette && page.palette.length >= 2)
    ? page.palette
    : (bookPalette && bookPalette.length >= 2)
      ? bookPalette
      : ["#F4D58D", "#8DB1AB", "#E76F51"];
  const emojis = (page.emojis || "🌳,🐰,☁️")
    .split(",").map(s => s.trim()).filter(Boolean).slice(0, 6);

  // Deterministic positions based on page number so they don't reshuffle
  const seed = (pageNumber * 9301 + 49297) % 233280;
  const rand = (n) => {
    const x = Math.sin(seed * (n + 1)) * 10000;
    return x - Math.floor(x);
  };

  const positions = emojis.map((e, i) => {
    if (isCover) {
      // Cluster for cover
      const ang = (i / Math.max(1, emojis.length)) * Math.PI * 2;
      return {
        emoji: e,
        x: 50 + Math.cos(ang) * 22,
        y: 50 + Math.sin(ang) * 18,
        size: i === 0 ? 90 : 60 + rand(i) * 20,
        rot: (rand(i + 30) - 0.5) * 14,
      };
    }
    // Spread across full width; alternate top/bottom tiers
    const slots = emojis.length;
    const xBase = 10 + (i / Math.max(1, slots - 1 || 1)) * 80;
    const tier = i % 2 === 0 ? 38 : 62;
    return {
      emoji: e,
      x: xBase + (rand(i) - 0.5) * 6,
      y: tier + (rand(i + 7) - 0.5) * 12,
      size: 48 + rand(i + 20) * 26,
      rot: (rand(i + 30) - 0.5) * 14,
    };
  });

  const gradId = `g-${pageNumber}`;
  const blobId = `blob-${pageNumber}`;
  const paperId = `paper-${pageNumber}`;

  return (
    <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "100%", display: "block" }}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={palette[0]} stopOpacity="0.45" />
          <stop offset="100%" stopColor={palette[1] || palette[0]} stopOpacity="0.25" />
        </linearGradient>
        <radialGradient id={blobId} cx="50%" cy="50%" r="60%">
          <stop offset="0%" stopColor={palette[2] || palette[0]} stopOpacity="0.35" />
          <stop offset="100%" stopColor={palette[2] || palette[0]} stopOpacity="0" />
        </radialGradient>
        <filter id={paperId}>
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix values="0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0.06 0"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>

      {/* Paper background */}
      <rect width="400" height="320" fill="#FBF6E9" />
      <rect width="400" height="320" fill={`url(#${gradId})`} />

      {/* Watercolour blobs */}
      <circle cx="80" cy="80" r="90" fill={`url(#${blobId})`} />
      <circle cx="320" cy="220" r="110" fill={`url(#${blobId})`} />
      <ellipse cx="200" cy="280" rx="180" ry="35" fill={palette[1] || palette[0]} fillOpacity="0.18" />

      {/* Horizon line / ground */}
      <path
        d="M 0 245 Q 100 235 200 248 T 400 245 L 400 320 L 0 320 Z"
        fill={palette[1] || "#B8C4A4"}
        fillOpacity="0.35"
      />

      {/* Scene elements (emojis) */}
      {positions.map((p, i) => (
        <text
          key={i}
          x={`${p.x}%`}
          y={`${p.y}%`}
          fontSize={p.size}
          textAnchor="middle"
          dominantBaseline="middle"
          transform={`rotate(${p.rot} ${(p.x / 100) * 400} ${(p.y / 100) * 320})`}
          style={{ filter: "drop-shadow(2px 3px 0 rgba(60,40,20,0.15))" }}
        >
          {p.emoji}
        </text>
      ))}

      {/* Paper grain */}
      <rect width="400" height="320" filter={`url(#${paperId})`} opacity="0.5" />
    </svg>
  );
}

/* ============================ TEXT-TO-SPEECH ============================ */
function useSpeech() {
  const [speaking, setSpeaking] = useState(false);
  const speak = useCallback((text) => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1.05;
    u.lang = "en-GB";
    // Try to pick a British voice
    const voices = window.speechSynthesis.getVoices();
    const british = voices.find(v => v.lang === "en-GB") || voices.find(v => v.lang?.startsWith("en"));
    if (british) u.voice = british;
    u.onstart = () => setSpeaking(true);
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    window.speechSynthesis.speak(u);
  }, []);
  const stop = useCallback(() => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setSpeaking(false);
  }, []);
  return { speak, stop, speaking };
}

function ReadingApp() {
  const [profiles, setProfiles] = useState(null);
  const [view, setView] = useState("home"); // home | reader | progress | library
  const [activeChild, setActiveChild] = useState(null);
  const [story, setStory] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadMsg, setLoadMsg] = useState("");
  const [error, setError] = useState(null);
  const [apiKey, setApiKey] = useState("");
  const [model, setModel] = useState("claude-sonnet-4-5");
  const [syncMode, setSyncMode] = useState(hasFB() ? "synced" : "local");
  const [authAllowed, setAuthAllowed] = useState(!!window._authAllowed);

  // Track sign-in state so we can re-read from Firebase (and reflect sync status) as soon as
  // someone signs in, without needing a full page reload.
  useEffect(() => {
    const onAuthChange = () => setAuthAllowed(!!window._authAllowed);
    onAuthChange();
    window.addEventListener("english-minutes-auth-changed", onAuthChange);
    return () => window.removeEventListener("english-minutes-auth-changed", onAuthChange);
  }, []);

  useEffect(() => {
    setSyncMode(hasFB() ? "synced" : "local");
    (async () => {
      const p = await loadKey(PROFILES_KEY, DEFAULT_PROFILES);
      setProfiles(p);
      const k = await loadKey(API_KEY_KEY, "");
      if (k) { setApiKey(k); setActiveApiKey(k); }
      const m = await loadKey(MODEL_KEY, "claude-sonnet-4-5");
      if (m) { setModel(m); setActiveModel(m); }
    })();
    // Warm up voices
    if (typeof window !== "undefined" && window.speechSynthesis) {
      window.speechSynthesis.getVoices();
    }
  }, [authAllowed]);

  const saveApiKey = useCallback(async (k) => {
    setApiKey(k);
    setActiveApiKey(k);
    await saveKey(API_KEY_KEY, k);
  }, []);
  const saveModel = useCallback(async (m) => {
    setModel(m);
    setActiveModel(m);
    await saveKey(MODEL_KEY, m);
  }, []);

  const saveProfiles = useCallback(async (next) => {
    setProfiles(next);
    await saveKey(PROFILES_KEY, next);
  }, []);

  // Streak tracks daily reading activity (opening any story, new or from the library) -
  // deliberately separate from awardCompletion, which only fires once per week when a new
  // story is finished. Tying streak to that made it impossible to build a streak from daily
  // reading, since it could only ever move once every 7 days.
  const markReadToday = async (id) => {
    const next = { ...profiles };
    const p = { ...next[id] };
    const today = new Date().toISOString().slice(0, 10);
    if (p.lastDay === today) return; // already counted today
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yISO = yesterday.toISOString().slice(0, 10);
    p.streak = p.lastDay === yISO ? (p.streak || 0) + 1 : 1;
    p.lastDay = today;
    next[id] = p;
    await saveProfiles(next);
  };

  // week is optional - defaults to the current week, or pass a past week's ISO string to
  // reopen an already-written story from the library.
  const openChild = async (id, week) => {
    setActiveChild(id);
    setView("reader");
    setError(null);
    const child = profiles[id];
    const targetWeek = week || isoWeek();
    const key = storyKey(id, targetWeek);
    let cached = await loadKey(key, null);
    if (!cached) {
      if (targetWeek !== isoWeek()) {
        setError("That story isn't available any more.");
        return;
      }
      setLoading(true);
      setLoadMsg("Looking for this week's story...");
      try {
        const s = await generateStoryFromLibrary(child, targetWeek, (msg) => setLoadMsg(msg));
        await saveKey(key, s);
        cached = s;
      } catch (e) {
        const detail = (e && e.message) ? ` (${e.message})` : "";
        setError(`We couldn't write a new story right now. Try again in a moment.${detail}`);
        setLoading(false);
        return;
      }
      setLoading(false);
    }
    setStory(cached);
    markReadToday(id);
  };

  const awardCompletion = async (id, week, title) => {
    const next = { ...profiles };
    const p = { ...next[id] };
    // Avoid double-awarding if the same week has already been completed
    const alreadyAwarded = (p.collection || []).some(c => c.week === week);
    if (alreadyAwarded) return;
    p.storiesRead = (p.storiesRead || 0) + 1;
    p.collection = [
      ...(p.collection || []),
      { id: week, emoji: critterFor(p, (p.collection || []).length), week, title: title || null },
    ];
    next[id] = p;
    await saveProfiles(next);
  };

  const backHome = () => {
    setView("home");
    setStory(null);
    setActiveChild(null);
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  };

  if (!profiles) {
    return (
      <div style={S.bootScreen}>
        <Loader2 size={42} className="spin" style={{ color: "#E76F51" }}/>
      </div>
    );
  }

  return (
    <div style={S.app}>
      <GoogleFontsAndCss />

      {view === "home" && (
        <Home
          profiles={profiles}
          hasApiKey={!!apiKey}
          syncMode={syncMode}
          onOpen={openChild}
          onProgress={(id) => { setActiveChild(id); setView("progress"); }}
          onLibrary={(id) => { setActiveChild(id); setView("library"); }}
          onSettings={() => setView("settings")}
        />
      )}

      {view === "settings" && (
        <ReadingSettingsView
          apiKey={apiKey}
          model={model}
          syncMode={syncMode}
          onSaveKey={saveApiKey}
          onSaveModel={saveModel}
          onBack={backHome}
        />
      )}

      {view === "reader" && (
        <Reader
          child={profiles[activeChild]}
          story={story}
          loading={loading}
          loadMsg={loadMsg}
          error={error}
          onBack={backHome}
          onProgressOpen={() => setView("progress")}
          onComplete={() => awardCompletion(activeChild, story?.week, story?.title)}
          onRegenerate={async () => {
            const week = isoWeek();
            const key = storyKey(activeChild, week);
            setStory(null);
            setLoading(true);
            setLoadMsg("Writing a fresh story...");
            try {
              const s = await generateStoryFromLibrary(profiles[activeChild], week, setLoadMsg);
              await saveKey(key, s);
              setStory(s);
            } catch (e) {
              const detail = (e && e.message) ? ` (${e.message})` : "";
              setError(`Couldn't generate. Try again.${detail}`);
            }
            setLoading(false);
          }}
        />
      )}

      {view === "progress" && (
        <Progress
          child={profiles[activeChild]}
          onBack={backHome}
        />
      )}

      {view === "library" && (
        <Library
          child={profiles[activeChild]}
          onOpen={(week) => openChild(activeChild, week)}
          onBack={backHome}
        />
      )}
    </div>
  );
}

/* ============================ SETTINGS ============================ */
function useAuthStatus() {
  const [status, setStatus] = useState(window._authStatus || { state: "checking" });
  useEffect(() => {
    const onChange = () => setStatus({ ...window._authStatus });
    onChange();
    window.addEventListener("english-minutes-auth-changed", onChange);
    return () => window.removeEventListener("english-minutes-auth-changed", onChange);
  }, []);
  return status;
}

function GoogleSignInCard() {
  const status = useAuthStatus();
  return (
    <div style={{ marginBottom: 12 }}>
      {status.state === "signed-in" ? (
        <>
          <p style={S.settingsHelp}>
            Signed in as <strong>{status.detail}</strong>. Progress syncs across devices for this account.
          </p>
          <button onClick={() => window._signOutOfGoogle()} style={{ ...S.settingsBtnPrimary, marginTop: 0, background: "#264653" }}>Sign out</button>
        </>
      ) : status.state === "denied" ? (
        <>
          <p style={{ ...S.settingsHelp, color: "#9b3a1f" }}>
            Signed in as <strong>{status.detail}</strong>, but this Google account isn't one of the family accounts allowed to sync this data.
          </p>
          <button onClick={() => window._signOutOfGoogle()} style={{ ...S.settingsBtnPrimary, marginTop: 0, background: "#264653" }}>Sign out</button>
        </>
      ) : (
        <>
          <p style={{ ...S.settingsHelp, color: status.state === "error" ? "#9b3a1f" : undefined }}>
            {status.state === "checking"
              ? "Checking sign-in..."
              : status.state === "error"
              ? `Sign-in failed: ${status.detail}`
              : "Sign in with a family Google account to sync across devices."}
          </p>
          <button onClick={() => window._signInWithGoogle()} style={{ ...S.settingsBtnPrimary, marginTop: 0 }}>Sign in with Google</button>
        </>
      )}
    </div>
  );
}

function ReadingSettingsView({ apiKey, model, syncMode, onSaveKey, onSaveModel, onBack }) {
  const [keyInput, setKeyInput] = useState(apiKey || "");
  const [modelInput, setModelInput] = useState(model || "claude-sonnet-4-5");
  const [revealed, setRevealed] = useState(false);
  const [testStatus, setTestStatus] = useState(null); // null | "testing" | "ok" | {error: msg}

  const masked = (k) => {
    if (!k) return "";
    if (k.length <= 12) return k;
    return k.slice(0, 8) + "..." + k.slice(-4);
  };

  const handleSave = async () => {
    await onSaveKey(keyInput.trim());
    await onSaveModel(modelInput.trim() || "claude-sonnet-4-5");
    setRevealed(false);
  };

  const handleTest = async () => {
    if (!keyInput.trim()) { setTestStatus({ error: "Add a key first." }); return; }
    setTestStatus("testing");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": keyInput.trim(),
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: modelInput.trim() || "claude-sonnet-4-5",
          max_tokens: 16,
          messages: [{ role: "user", content: "Say OK." }],
        }),
      });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.text()).slice(0, 160); } catch (e) {}
        setTestStatus({ error: `${res.status} ${detail}` });
        return;
      }
      setTestStatus("ok");
    } catch (e) {
      setTestStatus({ error: e.message || "Network error" });
    }
  };

  return (
    <div style={S.settingsWrap}>
      <button onClick={onBack} style={S.backBtn}>
        <ArrowLeft size={16}/> Back
      </button>
      <h1 style={{ ...S.h1, fontSize: 32, margin: "18px 0 6px" }}>Settings</h1>
      <p style={S.subtitle}>Add your Anthropic API key below to generate this week's story.</p>

      <div style={{ ...S.settingsCard, marginTop: 16 }}>
        <label style={S.settingsLabel}>Anthropic API Key</label>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input
            type={revealed ? "text" : "password"}
            value={keyInput}
            onChange={(e) => setKeyInput(e.target.value)}
            placeholder="sk-ant-..."
            style={S.settingsInput}
            spellCheck={false}
            autoCapitalize="off"
            autoCorrect="off"
          />
          <button onClick={() => setRevealed(v => !v)} style={{ ...S.settingsBtnPrimary, marginTop: 0, background: "#264653", padding: "12px 14px" }}>
            <Eye size={16}/>
          </button>
        </div>
        {!revealed && apiKey && (
          <p style={{ ...S.settingsHelp, fontFamily: "monospace" }}>Saved: {masked(apiKey)}</p>
        )}
        <p style={S.settingsHelp}>
          Get one at <strong>console.anthropic.com</strong> · API Keys. Your key stays in your browser and (if Firebase sync is on) in your private family database.
        </p>

        <label style={{ ...S.settingsLabel, marginTop: 18 }}>Model</label>
        <input
          type="text"
          value={modelInput}
          onChange={(e) => setModelInput(e.target.value)}
          placeholder="claude-sonnet-4-5"
          style={S.settingsInput}
          spellCheck={false}
        />
        <p style={S.settingsHelp}>
          Default is <code>claude-sonnet-4-5</code>. Other options include <code>claude-sonnet-4-6</code>, <code>claude-haiku-4-5</code>, <code>claude-opus-4-7</code>.
        </p>

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 16 }}>
          <button onClick={handleSave} style={S.settingsBtnPrimary}>
            <Check size={16}/> Save
          </button>
          <button onClick={handleTest} style={{ ...S.settingsBtnPrimary, background: "#264653" }}>
            <Sparkles size={16}/> Test connection
          </button>
        </div>
        {testStatus === "testing" && <p style={{ ...S.settingsHelp, color: "#264653" }}>Testing...</p>}
        {testStatus === "ok" && <p style={{ ...S.settingsHelp, color: "#1c7a5d", fontWeight: 700 }}><Check size={14}/> Key works.</p>}
        {testStatus && testStatus.error && <p style={{ ...S.settingsHelp, color: "#9b3a1f", fontWeight: 600 }}>Failed: {testStatus.error}</p>}
      </div>

      <div style={S.settingsCard}>
        <label style={S.settingsLabel}>Sync</label>
        <GoogleSignInCard />
        {syncMode === "synced" ? (
          <p style={S.settingsHelp}>
            <strong>Connected to Firebase.</strong> Progress and stories sync across both phones for family <code>{typeof FAMILY_CODE !== "undefined" ? FAMILY_CODE : ""}</code>.
          </p>
        ) : (
          <p style={S.settingsHelp}>
            <strong>Local mode.</strong> Sign in with a family Google account above to sync across devices - progress is stored on this device only until then.
          </p>
        )}
      </div>

      <div style={S.settingsCard}>
        <label style={S.settingsLabel}>About</label>
        <p style={S.settingsHelp}>
          Charlie's Reading generates a fresh storybook each Monday tailored to each boy's reading level. Stories are cached for the week so revisiting the book opens the same story.
        </p>
      </div>
    </div>
  );
}

/* ============================ READER ============================ */
function Reader({ child, story, loading, loadMsg, error, onBack, onProgressOpen, onRegenerate, onComplete }) {
  const [pageIdx, setPageIdx] = useState(0);
  const [showQuestion, setShowQuestion] = useState(false);
  const [answeredQuestions, setAnsweredQuestions] = useState({});
  const completedRef = useRef(false);
  const { speak, stop, speaking } = useSpeech();
  const band = BANDS[bandForChild(child)];

  // Trigger completion award once when reader finishes
  useEffect(() => {
    if (!story) return;
    const total = story.pages.length;
    const lastIdx = total - 1;
    if (pageIdx === lastIdx && answeredQuestions[lastIdx] && !completedRef.current) {
      completedRef.current = true;
      onComplete && onComplete();
    }
  }, [pageIdx, answeredQuestions, story, onComplete]);

  // Load progress
  useEffect(() => {
    if (!story) return;
    (async () => {
      const prog = await loadKey(progressKey(child.id, story.week), { page: 0, answered: {} });
      setPageIdx(prog.page || 0);
      setAnsweredQuestions(prog.answered || {});
    })();
  }, [story, child.id]);

  // Save progress
  useEffect(() => {
    if (!story) return;
    saveKey(progressKey(child.id, story.week), { page: pageIdx, answered: answeredQuestions });
  }, [pageIdx, answeredQuestions, story, child.id]);

  if (loading) {
    return (
      <div style={S.loadingWrap}>
        <button onClick={onBack} style={S.backTopBtn}><ArrowLeft size={18}/> Back</button>
        <div style={S.loadingCore}>
          <div style={S.loadingBook}>
            <Loader2 size={56} className="spin" style={{ color: band.colour }}/>
          </div>
          <h2 style={S.loadingTitle}>{loadMsg || "Just a moment..."}</h2>
          <p style={S.loadingSub}>Writing {child.name}'s new story. This usually takes 20–30 seconds.</p>
          <LoadingTicker/>
        </div>
      </div>
    );
  }
  if (error) {
    return (
      <div style={S.loadingWrap}>
        <button onClick={onBack} style={S.backTopBtn}><ArrowLeft size={18}/> Back</button>
        <div style={S.loadingCore}>
          <h2 style={{ ...S.loadingTitle, color: "#B33" }}>Hmm, something went wrong</h2>
          <p style={S.loadingSub}>{error}</p>
          <button style={{ ...S.openBtn, background: band.colour, marginTop: 14 }} onClick={onRegenerate}>
            <RefreshCw size={16}/> Try again
          </button>
        </div>
      </div>
    );
  }
  if (!story) return null;

  const totalPages = story.pages.length;
  const page = story.pages[pageIdx];
  const isCover = pageIdx === 0;
  const isLast = pageIdx === totalPages - 1;
  const hasQuestion = !!page.question;
  const questionAnswered = !!answeredQuestions[pageIdx];
  const mustAnswer = hasQuestion && !questionAnswered;

  const next = () => {
    stop();
    if (mustAnswer) { setShowQuestion(true); return; }
    if (pageIdx < totalPages - 1) setPageIdx(pageIdx + 1);
  };
  const prev = () => {
    stop();
    if (pageIdx > 0) setPageIdx(pageIdx - 1);
  };

  const readPage = () => {
    if (speaking) { stop(); return; }
    const text = isCover ? `${story.title}. ${story.subtitle || ""}` : page.text;
    speak(text);
  };

  return (
    <div style={S.readerWrap}>
      <div style={S.readerTop}>
<button onClick={onBack} style={S.backTopBtn}><ArrowLeft size={16}/> Home</button>
        <div style={{ ...S.readerCrumb, color: band.colour }}>
          <span style={{ ...S.bandDot, background: band.colour }}/>
          {band.name} · {child.name}
        </div>
        <button onClick={readPage} style={S.iconBtn} title="Read this page">
          {speaking ? <VolumeX size={18}/> : <Volume2 size={18}/>}
        </button>
      </div>

      {/* Book spread */}
      <div style={S.bookOuter}>
        <div style={S.book}>
          {/* Page (illustration on top on mobile, left on desktop) */}
          <div className="book-spread">
            <div className="illu" style={S.illustrationWrap}>
              <SceneIllustration page={page} pageNumber={pageIdx} isCover={isCover} bookPalette={story.palette}/>
            </div>
            <div style={S.textWrap}>
              {isCover ? (
                <>
                  <div style={S.coverTag}>{band.name} · {child.name}'s book</div>
                  <h1 style={S.bookTitle}>{story.title}</h1>
                  {story.subtitle && <p style={S.bookSubtitle}>{story.subtitle}</p>}
                  <p style={S.coverText}>{page.text}</p>
                  <p style={S.coverHint}>Tap <ChevronRight size={14} style={{ verticalAlign:"middle" }}/> to start reading.</p>
                </>
              ) : (
                <>
                  <p style={{ ...S.pageText, fontSize: child.id === "freddie" ? 26 : 22 }}>{page.text}</p>
                  {hasQuestion && !questionAnswered && (
                    <button
                      style={{ ...S.questionPill, borderColor: band.colour, color: band.colour }}
                      onClick={() => setShowQuestion(true)}
                    >
                      <QuestionIcon type={page.question.type}/>
                      {labelForQuestionType(page.question.type)} · Answer to continue
                    </button>
                  )}
                  {hasQuestion && questionAnswered && (
                    <div style={S.answeredChip}>
                      <Check size={14}/> {labelForQuestionType(page.question.type)} answered
                    </div>
                  )}
                </>
              )}
              <div style={S.pageNum}>{isCover ? "Cover" : `Page ${pageIdx} of ${totalPages - 1}`}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Controls */}
      <div style={S.controls}>
        <button onClick={prev} disabled={pageIdx === 0} style={{ ...S.navBtn, opacity: pageIdx === 0 ? 0.35 : 1 }}>
          <ChevronLeft size={18}/> Back
        </button>
        <div style={S.progressBar}>
          <div style={{ ...S.progressFill, width: `${((pageIdx + 1) / totalPages) * 100}%`, background: band.colour }}/>
        </div>
        <button onClick={next} disabled={isLast && (!mustAnswer || questionAnswered)} style={{ ...S.navBtn, background: band.colour, color: "#FBF6E9", opacity: isLast && questionAnswered ? 0.55 : 1 }}>
          {isLast && (questionAnswered || !hasQuestion) ? <>Finish <Trophy size={18}/></> : <>Next <ChevronRight size={18}/></>}
        </button>
      </div>

      {/* Question modal */}
      {showQuestion && hasQuestion && (
        <QuestionModal
          question={page.question}
          band={band}
          onClose={() => setShowQuestion(false)}
          onAnswer={(correct) => {
            setAnsweredQuestions({ ...answeredQuestions, [pageIdx]: { correct, ts: Date.now() } });
            setShowQuestion(false);
            if (!isLast) setPageIdx(pageIdx + 1);
          }}
        />
      )}

      {/* Finish state - fires whenever the last page is done: either the question is answered, or there was no question to answer */}
      {isLast && (questionAnswered || !hasQuestion) && (
        <FinishOverlay
          child={child}
          band={band}
          story={story}
          answered={answeredQuestions}
          onProgressOpen={onProgressOpen}
          onBack={onBack}
          onReadAgain={() => setPageIdx(0)}
        />
      )}
    </div>
  );
}

function labelForQuestionType(t) {
  switch (t) {
    case "retrieval": return "Retrieval";
    case "prediction": return "Prediction";
    case "skimscan": return "Skim & Scan";
    case "inference": return "Inference";
    default: return "Question";
  }
}
function QuestionIcon({ type, size = 14 }) {
  switch (type) {
    case "retrieval": return <Eye size={size}/>;
    case "prediction": return <HelpCircle size={size}/>;
    case "skimscan": return <Search size={size}/>;
    case "inference": return <Brain size={size}/>;
    default: return <HelpCircle size={size}/>;
  }
}

function LoadingTicker() {
  const msgs = [
    "Picking out characters...",
    "Choosing a setting...",
    "Adding twists and turns...",
    "Sprinkling in tricky words...",
    "Drawing the pictures in our head...",
    "Writing in proper UK spelling...",
    "Almost ready...",
  ];
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI(x => (x + 1) % msgs.length), 3500);
    return () => clearInterval(t);
  }, []);
  return (
    <div style={{
      marginTop: 18, padding: "10px 16px",
      background: "#FFFBEC", border: "1px dashed #E0D3B5",
      borderRadius: 999, fontSize: 13, color: "#5C4A3A",
      fontStyle: "italic",
    }}>
      {msgs[i]}
    </div>
  );
}

/* ============================ QUESTION MODAL ============================ */
function QuestionModal({ question, band, onAnswer, onClose }) {
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const correct = selected === question.answer;

  const choose = (opt) => {
    if (revealed) return;
    setSelected(opt);
    setRevealed(true);
  };

  return (
    <div style={S.modalBg} onClick={onClose}>
      <div style={S.modal} onClick={(e) => e.stopPropagation()}>
        <div style={{ ...S.modalTop, background: band.colour }}>
          <div style={S.modalIcon}>
            <QuestionIcon type={question.type} size={20}/>
          </div>
          <div>
            <div style={S.modalKicker}>{labelForQuestionType(question.type)}</div>
            <h3 style={S.modalQ}>{question.prompt}</h3>
          </div>
        </div>
        <div style={S.modalBody}>
          {question.hint && !revealed && (
            <p style={S.hintText}><strong>Tip:</strong> {question.hint}</p>
          )}
          <div style={S.options}>
            {question.options.map((opt, i) => {
              const isSel = selected === opt;
              const isAns = opt === question.answer;
              let bg = "#FBF6E9";
              let border = "#E0D3B5";
              let ic = null;
              if (revealed) {
                if (isAns) { bg = "#D8F1DA"; border = "#5BA463"; ic = <Check size={16}/>; }
                else if (isSel && !isAns) { bg = "#FCD9D6"; border = "#D75A56"; ic = <X size={16}/>; }
              }
              return (
                <button key={i} onClick={() => choose(opt)} disabled={revealed}
                  style={{ ...S.option, background: bg, borderColor: border }}>
                  <span style={S.optionLetter}>{String.fromCharCode(65 + i)}</span>
                  <span style={{ flex: 1 }}>{opt}</span>
                  {ic}
                </button>
              );
            })}
          </div>
          {revealed && (
            <div style={S.feedback}>
              {correct
                ? <p style={{ ...S.fbText, color: "#2A7E37" }}>Brilliant! That's right.</p>
                : <p style={{ ...S.fbText, color: "#B33" }}>Good try · the answer was <strong>{question.answer}</strong>.</p>}
              <button style={{ ...S.openBtn, background: band.colour }} onClick={() => onAnswer(correct)}>
                Carry on reading <ChevronRight size={16}/>
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  const newCritter = (child.collection && child.collection[child.collection.length - 1])
    ? child.collection[child.collection.length - 1].emoji

  return (
    <div style={S.modalBg} onClick={onReadAgain}>

/* ============================ SHELL ============================ */
function Shell() {
  const [view, setView] = useState("welcome"); // welcome | picker | phonics | reading

  // Persist last view so phone refresh doesn't always reset to welcome
  useEffect(() => {
    try {
      const last = localStorage.getItem("english_minutes_last_view");
      if (last && (last === "phonics" || last === "reading" || last === "picker")) {
        setView(last);
      }
    } catch {}
  }, []);

  useEffect(() => {
    try {
      if (view !== "welcome") localStorage.setItem("english_minutes_last_view", view);
    } catch {}
  }, [view]);

  // Expose the app switcher globally so the phonics/reading Headers can call it
  // (via a small icon button in their top bar). This replaces the floating button
  // that used to overlap the bottom navigation.
  useEffect(() => {
    window._currentApp = view;
    window._switchApp = () => setView(view === "phonics" ? "reading" : "phonics");
    window._goHomeApps = () => setView("picker");
  }, [view]);

  if (view === "welcome") {
    return <Welcome onContinue={() => setView("picker")} />;
  }
  if (view === "picker") {
    return <Picker onPick={(app) => setView(app)} />;
  }

  return view === "phonics" ? <PhonicsAppCmp /> : <ReadingAppCmp />;
}
