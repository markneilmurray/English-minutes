  <script>
    // Family code is always defined so the app boots even if Firebase fails to load
    var FAMILY_CODE = "murray-7f3k9q2x-home";

    // Only these Google accounts may read/write this family's cloud data (see Maths Minutes:
    // a bare family-code string in client JS is not real access control - anyone who views
    // source on the deployed page can read/write it. Google Sign-In + matching Realtime
    // Database rules close that hole here too).
    var ALLOWED_EMAILS = ["markneilmurray@gmail.com", "hannahemurray92@gmail.com"];

    // Firebase config - shared with Daily Maths Minutes app, isolated paths per sub-app
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyCdY2PnB_J2xgKWK-cYHLdNLt-a1SmCz0I",
      authDomain: "maths-minutes.firebaseapp.com",
      databaseURL: "https://maths-minutes-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "maths-minutes",
      storageBucket: "maths-minutes.firebasestorage.app",
      messagingSenderId: "706834197716",
      appId: "1:706834197716:web:bc50de18da9ff70a0d9f41"
    };

    // Firebase scripts are deferred (so they don't block the rest of the page). Poll for them
    // to become available rather than assuming they're loaded synchronously. The Tesla browser
    // sometimes runs main scripts before deferred ones finish - this handles that gracefully.
    window._firebaseReady = false;
    window._firebaseInitAttempts = 0;
    // Auth state: null while we haven't heard from Firebase yet, then either a signed-in
    // allowed user, or "denied" (signed in but not an allowed email), or "signed-out".
    window._authChecked = false;
    window._authUser = null;
    window._authAllowed = false;
    window._authStatus = { state: "checking", detail: "" };
    function _setAuthStatus(state, detail) {
      window._authStatus = { state: state, detail: detail || "" };
      window.dispatchEvent(new Event("english-minutes-auth-changed"));
    }
    window._signInWithGoogle = function () {
      if (typeof firebase === "undefined" || !firebase.auth) return;
      _setAuthStatus("checking", "Signing in...");
      firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) {
        _setAuthStatus("error", (e && e.message) || "Sign-in failed");
      });
    };
    window._signOutOfGoogle = function () {
      if (typeof firebase === "undefined" || !firebase.auth) return;
      firebase.auth().signOut();
    };
    (function waitForFirebase() {
      window._firebaseInitAttempts++;
      if (typeof firebase !== "undefined" && firebase.initializeApp) {
        try {
          firebase.initializeApp(FIREBASE_CONFIG);
          window._firebaseReady = true;
          console.log("[boot] Firebase ready after " + window._firebaseInitAttempts + " attempt(s)");
          firebase.auth().onAuthStateChanged(function (u) {
            window._authChecked = true;
            window._authUser = u;
            if (u && ALLOWED_EMAILS.indexOf(u.email) >= 0) {
              window._authAllowed = true;
              _setAuthStatus("signed-in", u.email);
            } else {
              window._authAllowed = false;
              _setAuthStatus(u ? "denied" : "signed-out", u ? u.email : "");
            }
          });
        } catch (e) {
          console.error("Firebase init error:", e);
          window._authChecked = true; // don't hang the UI waiting on auth that will never resolve
        }
        return;
      }
      if (window._firebaseInitAttempts < 50) {
        setTimeout(waitForFirebase, 100); // 5 seconds max wait
      } else {
        console.warn("Firebase scripts did not load after 5s - running in local-only mode");
        window._authChecked = true;
      }
    })();

    // Global error trap: if anything blows up before React mounts, show the user a useful
    // diagnostic screen rather than a blank page. This is the difference between "the app
    // is broken" (terrifying) and "we know what went wrong" (workable).
    window._bootErrors = [];
    function showBootError(label, details) {
      window._bootErrors.push({ label, details, t: new Date().toISOString() });
      var root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = '<div style="padding:24px;font-family:-apple-system,system-ui,sans-serif;color:#143232;max-width:560px;margin:40px auto;background:#FAFAFA;border-radius:16px;border:2px solid #E5DDC9;">' +
        '<div style="font-size:18px;font-weight:700;margin-bottom:12px;">English Minutes had a problem starting up</div>' +
        '<div style="font-size:14px;color:#5a6b5f;margin-bottom:16px;line-height:1.5;">Try closing and reopening the page. If this keeps happening, the details below will help diagnose it.</div>' +
        '<details style="font-size:12px;color:#7a8b80;font-family:monospace;background:#F5EFE6;padding:12px;border-radius:8px;">' +
        '<summary style="cursor:pointer;font-weight:600;color:#143232;">Diagnostic details</summary>' +
        '<div style="margin-top:8px;white-space:pre-wrap;word-break:break-word;">' +
        window._bootErrors.map(function(e) { return e.t + " " + e.label + ":\n" + e.details; }).join("\n\n") +
        '\nUser agent: ' + navigator.userAgent +
        '\nFirebase ready: ' + window._firebaseReady +
        '\nFirebase attempts: ' + window._firebaseInitAttempts +
        '</div></details></div>';
    }
    window.addEventListener("error", function(e) {
      showBootError("Uncaught error", (e && e.error && e.error.stack) || (e && e.message) || String(e));
    });
    window.addEventListener("unhandledrejection", function(e) {
      showBootError("Promise rejection", (e && e.reason && e.reason.stack) || String(e && e.reason));
    });
  </script>

const mergeWithDefault = (parsed) => {
  const def = DEFAULT_DATA();
  const mergedProfiles = {};
  // Deep-merge each profile so any missing fields (e.g. collection on an old save) get defaults
  for (const id of Object.keys(def.profiles)) {
    const defProfile = def.profiles[id];
    const parsedProfile = (parsed.profiles || {})[id] || {};
    mergedProfiles[id] = {
      ...defProfile,
      ...parsedProfile,
      // Guarantee these fields exist as the right type even if old data set them to null/undefined
      collection: Array.isArray(parsedProfile.collection) ? parsedProfile.collection : [],
      subjects: (parsedProfile.subjects && typeof parsedProfile.subjects === "object") ? parsedProfile.subjects : {},
      days: (parsedProfile.days && typeof parsedProfile.days === "object") ? parsedProfile.days : {},
      points: typeof parsedProfile.points === "number" ? parsedProfile.points : 0,
      streak: typeof parsedProfile.streak === "number" ? parsedProfile.streak : 0,
      // Inherit yearStart from defaults if the stored profile doesn't have one
      yearStart: parsedProfile.yearStart || defProfile.yearStart || null,
    };
  }
  return {
    ...def,
    ...parsed,
    profiles: mergedProfiles,
  };
};

const hasFirebase = () => typeof firebase !== "undefined" && firebase.database && window._firebaseReady;
// Gate actual reads/writes on being signed in as an allowed family Google account, not just
// on the family code being known - the code alone isn't real access control (see Maths Minutes).
const canSyncFirebase = () => hasFirebase() && window._authAllowed === true;

// Wait up to 5 seconds for Firebase to become ready. Used by loadData on boot so the very
// first load can actually find the kids' progress, even if Firebase scripts are still loading.
async function waitForFirebaseReady(maxMs = 5000) {
  const start = Date.now();
  while (!hasFirebase() && Date.now() - start < maxMs) {
    await new Promise(r => setTimeout(r, 100));
  }
  // Auth state resolves fast once Firebase itself is ready (it's just reading a cached
  // session), so give it a short bounded extra wait rather than losing sync for a returning
  // signed-in user on the very first load of the page.
  const authStart = Date.now();
  while (!window._authChecked && Date.now() - authStart < 2000) {
    await new Promise(r => setTimeout(r, 50));
  }
  return hasFirebase();
}

// Track the highest "days completed" count per profile we've ever seen.
// This is the most important thing to protect - losing day records loses the kid's history.
// Points alone can decrease legitimately when buying character parts, so we don't guard those.
const _highWaterMarks = {}; // { profileId: { daysCount, hasSubjects, hasUnlocked } }

function updateHighWater(d) {
  if (!d || !d.profiles) return;
  for (const [id, p] of Object.entries(d.profiles)) {
    if (!_highWaterMarks[id]) _highWaterMarks[id] = { daysCount: 0, hasSubjects: false, hasUnlocked: false };
    const w = _highWaterMarks[id];
    w.daysCount = Math.max(w.daysCount, Object.keys(p.days || {}).length);
    w.hasSubjects = w.hasSubjects || Object.keys(p.subjects || {}).length > 0;
    w.hasUnlocked = w.hasUnlocked || (p.unlocked || []).length > 0;
  }
}

function isReset(d) {
  // Returns true if the data looks like a hard reset over known-good progress.
  // Specifically: any profile has FEWER days than we've ever seen for that profile.
  if (!d || !d.profiles) return true;
  for (const [id, w] of Object.entries(_highWaterMarks)) {
    const p = d.profiles[id];
    if (!p) return true; // profile entirely missing - definitely a reset
    const curDays = Object.keys(p.days || {}).length;
    if (curDays < w.daysCount) return true; // lost day records
  }
  return false;
}

// Tracks whether the initial load from Firebase has completed - we BLOCK saves until it does
let _firebaseLoadComplete = false;
// Set to true by the explicit "Reset profile" button to allow an intentional wipe
let _allowReset = false;
function allowResetOnce() { _allowReset = true; }

async function loadData() {
  // Optimistic: read local first for instant UI
  let local = null;
  try {
    const raw = typeof localStorage !== "undefined" ? localStorage.getItem(KEY) : null;
    if (raw) local = mergeWithDefault(JSON.parse(raw));
  } catch {}
  if (local) updateHighWater(local);

  // Wait briefly for Firebase scripts to finish loading (deferred). This matters on the
  // Tesla browser where deferred scripts can finish well after the React mount.
  await waitForFirebaseReady(5000);

  // Then try Firebase; prefer remote if present
  try {
    if (canSyncFirebase()) {
      const snap = await firebase.database().ref(FB_PATH).once("value");
      const v = snap.val();
      _firebaseLoadComplete = true;
      if (v) {
        const merged = mergeWithDefault(v);
        updateHighWater(merged);
        try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
        return merged;
      }
    } else {
      _firebaseLoadComplete = true; // local-only mode
    }
  } catch (e) { console.warn("Firebase load failed:", e); _firebaseLoadComplete = true; }

  return local || DEFAULT_DATA();
}

async function saveData(d) {
  // GUARD 1: never save before initial Firebase load completes
  if (!_firebaseLoadComplete) {
    console.warn("[english-minutes] saveData blocked - Firebase load not complete yet");
    return;
  }
  // GUARD 2: never accidentally wipe day records / progress history
  if (isReset(d) && !_allowReset) {
    console.warn("[english-minutes] saveData blocked - would wipe day records. High water marks:", _highWaterMarks);
    return;
  }
  _allowReset = false; // consume the one-time allow flag
  updateHighWater(d);

  // Always save locally for instant access
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(KEY, JSON.stringify(d));
    }
  } catch {}
  // Sync to Firebase
  try {
    if (canSyncFirebase()) {
      await firebase.database().ref(FB_PATH).set(d);
      // Fire-and-forget daily snapshot (doesn't block, doesn't crash on failure)
      writeDailySnapshot(d).catch(e => console.warn("Daily snapshot failed:", e));
    }
  } catch (e) { console.warn("Firebase save failed:", e); }
}

// ============== AUTOMATIC DAILY BACKUPS ==============
// On every save, we also write a per-day snapshot to a separate Firebase path. Each day's
// slot gets overwritten by later saves that same day, so the slot ends up holding the day's
// final state. We keep the last 30 snapshots and prune older ones.
const BACKUP_PATH = "families/" + FAMILY_CODE + "/english_backups";

function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function writeDailySnapshot(d) {
  if (!canSyncFirebase()) return;
  const today = todayLocalISO();
  await firebase.database().ref(BACKUP_PATH + "/" + today).set({
    savedAt: new Date().toISOString(),
    data: d,
  });
  // Prune old snapshots (keep last 30) - fire and forget
  pruneOldSnapshots().catch(e => console.warn("Prune failed:", e));
}

async function pruneOldSnapshots() {
  if (!canSyncFirebase()) return;
  const snap = await firebase.database().ref(BACKUP_PATH).once("value");
  const val = snap.val() || {};
  const dates = Object.keys(val).sort(); // ISO sorts chronologically
  if (dates.length <= 30) return;
  const toDelete = dates.slice(0, dates.length - 30);
  for (const date of toDelete) {
    await firebase.database().ref(BACKUP_PATH + "/" + date).remove();
  }
}

async function listBackups() {
  if (!canSyncFirebase()) return [];
  try {
    const snap = await firebase.database().ref(BACKUP_PATH).once("value");
    const val = snap.val() || {};
    return Object.keys(val).sort().reverse().map(date => ({
      date,
      savedAt: val[date].savedAt,
      data: val[date].data,
    }));
  } catch (e) {
    console.warn("List backups failed:", e);
    return [];
  }
}

function subscribeData(callback) {
  if (!canSyncFirebase()) return () => {};
  const ref = firebase.database().ref(FB_PATH);
  const handler = (snap) => {
    const v = snap.val();
    if (v) {
      const merged = mergeWithDefault(v);
      updateHighWater(merged);
      try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
      callback(merged);
    }
  };
  ref.on("value", handler);
  return () => ref.off("value", handler);
}

function seededRng(seedStr) {
  let s = 0;
  for (let i = 0; i < seedStr.length; i++) s = (s * 31 + seedStr.charCodeAt(i)) >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 0xffffffff;
  };
}

const shuffle = (arr, rng) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// Voice selection: STRICTLY British English. We hard-filter to en-GB to avoid the
// system falling back to Australian (en-AU) or American (en-US) voices, which it
// does by default on many devices when no en-GB voice is explicitly selected.
let _cachedVoice = null;
let _userVoiceName = null;

const setUserVoice = (name) => {
  _userVoiceName = name || null;
  _cachedVoice = null; // force re-pick on next speak
};

const listBritishVoices = () => {
  if (typeof window === "undefined" || !window.speechSynthesis) return [];
  const voices = window.speechSynthesis.getVoices() || [];
  return voices.filter(v =>
    v.lang === "en-GB" ||
    v.lang === "en_GB" ||
    /united kingdom|great britain|british|\buk english\b/i.test(v.name)
  );
};

const _pickVoice = () => {
  if (typeof window === "undefined" || !window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;

  // User-chosen voice takes precedence
  if (_userVoiceName) {
    const userPick = voices.find(v => v.name === _userVoiceName);
    if (userPick) return userPick;
  }

  // HARD FILTER: only true British English voices
  const britishVoices = listBritishVoices();

  // Priority within British voices - prefer high-quality female voices first
  const preferredPatterns = [
    /^Google UK English Female$/i,
    /sonia.*natural/i,
    /libby.*natural/i,
    /microsoft hazel/i,
    /microsoft susan/i,
    /^Serena\b/i,
    /^Kate\b/i,
    /^Martha\b/i,
    /^Stephanie\b/i,
    /^Daniel\b/i,
    /^Arthur\b/i,
    /^Oliver\b/i,
    /^Google UK English Male$/i,
    /microsoft george/i,
    /microsoft ryan/i,
  ];
  for (const pattern of preferredPatterns) {
    const v = britishVoices.find(x => pattern.test(x.name));
    if (v) return v;
  }

  // Any remaining British voice
  if (britishVoices.length) return britishVoices[0];

  // No British voice available - fall back to American (closer to British than Australian)
  // but EXPLICITLY skip en-AU
  const enUS = voices.find(v => v.lang === "en-US");
  if (enUS) return enUS;
  return voices.find(v => v.lang && v.lang.startsWith("en") && v.lang !== "en-AU") || null;
};

if (typeof window !== "undefined" && window.speechSynthesis) {
  // Trigger initial voice load (voices often load asynchronously)
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener?.("voiceschanged", () => {
    _cachedVoice = _pickVoice();
  });
}

const speak = (text) => {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    // Small delay so cancel completes before new utterance starts (prevents cut-offs)
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      // Re-pick if we haven't got a British voice yet (voices may have loaded since)
      if (!_cachedVoice || (_cachedVoice.lang !== "en-GB" && _cachedVoice.lang !== "en_GB")) {
        const fresh = _pickVoice();
        if (fresh) _cachedVoice = fresh;
      }
      if (_cachedVoice) {
        u.voice = _cachedVoice;
        u.lang = _cachedVoice.lang;
      } else {
        u.lang = "en-GB";
      }
      u.rate = 0.9;
      u.pitch = 1.05;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }, 60);
  } catch {}
};

/* ============================ Y1 QUESTION GENERATORS ============================ */
// Each generator returns { subject, type, prompt, audio, answer, options, mode }
// mode: "choice" (tap an option) or "type" (text input)

function qPhonicsGrapheme(rng) {
  const pair = pick(PHASE5, rng);
  const word = pick(pair.words, rng);
  const distractors = sample(PHASE5.filter(p => p.g !== pair.g), 3, rng).map(p => p.g);
  return {
    subject: "phonics",
    type: "grapheme",
    prompt: `Which letters make the sound in this word?`,
    word,
    audio: `Which letters make the sound in the word ${word}?`,
    answer: pair.g,
    options: shuffle([pair.g, ...distractors], rng),
    mode: "choice",
  };
}

function qPhonicsFindWord(rng) {
  const pair = pick(PHASE5, rng);
  const correct = pick(pair.words, rng);
  const other = sample(PHASE5.filter(p => p.aud !== pair.aud), 3, rng);
  const distractors = other.map(p => pick(p.words, rng));
  return {
    subject: "phonics",
    type: "find_sound",
    prompt: `Which word has the "${pair.g}" sound (like in ${pair.words[0]})?`,
    audio: `Which word has the sound ${pair.aud}?`,
    answer: correct,
    options: shuffle([correct, ...distractors], rng),
    mode: "choice",
  };
}

function qCewRead(rng, pool) {
  const target = pick(pool, rng);
  const distractors = sample(pool.filter(w => w !== target), 3, rng);
  return {
    subject: "cew",
    type: "cew_read",
    prompt: `Find the tricky word:`,
    audio: `Find the word ${target}.`,
    spoken: target,
    answer: target,
    options: shuffle([target, ...distractors], rng),
    mode: "choice",
  };
}

function qCewSpell(rng, pool) {
  // Allow most words; only skip "I" (which is just one letter)
  const target = pick(pool.filter(w => w !== "I"), rng);
  return {
    subject: "spelling",
    type: "spell",
    prompt: `Spell the tricky word you hear:`,
    audio: `Spell the word ${target}.`,
    spoken: target,
    answer: target,
    mode: "type",
  };
}

function qHfwSpell(rng, pool) {
  const target = pick(pool.filter(w => w.length <= 4), rng);
  return {
    subject: "spelling",
    type: "spell_hfw",
    prompt: `Spell this word:`,
    audio: `Spell the word ${target}.`,
    spoken: target,
    answer: target,
    mode: "type",
  };
}

    { text: ["The","cat","runs","fast"],         type: "verb", answer: "runs" },
    { text: ["The","boy","plays","ball"],        type: "verb", answer: "plays" },
    { text: ["We","jumped","over","puddles"],    type: "verb", answer: "jumped" },
    { text: ["She","sings","at","school"],       type: "verb", answer: "sings" },
    { text: ["The","baby","laughs","loudly"],    type: "verb", answer: "laughs" },
    { text: ["My","sister","reads","books"],     type: "verb", answer: "reads" },
    { text: ["The","kettle","whistles"],         type: "verb", answer: "whistles" },
    { text: ["A","bee","stings"],                type: "verb", answer: "stings" },
    // adjectives
    { text: ["A","big","dog","barked"],          type: "adjective", answer: "big" },
    { text: ["My","mum","is","happy"],           type: "adjective", answer: "happy" },
    { text: ["The","tall","tree","sways"],       type: "adjective", answer: "tall" },
    { text: ["A","silly","goose","quacks"],      type: "adjective", answer: "silly" },
    { text: ["I","saw","a","fluffy","cat"],      type: "adjective", answer: "fluffy" },
    { text: ["The","cold","wind","blew"],        type: "adjective", answer: "cold" },
    { text: ["A","loud","alarm","rang"],         type: "adjective", answer: "loud" },
    { text: ["The","tiny","mouse","squeaks"],    type: "adjective", answer: "tiny" },
    // nouns
    { text: ["The","red","car","stops"],         type: "noun", answer: "car" },
    { text: ["I","saw","a","star"],              type: "noun", answer: "star" },
    { text: ["My","dog","ran","away"],           type: "noun", answer: "dog" },
    { text: ["The","cake","tasted","nice"],      type: "noun", answer: "cake" },
    { text: ["A","spider","climbed","the","wall"],type: "noun", answer: "spider" },
    { text: ["Our","teacher","is","kind"],       type: "noun", answer: "teacher" },
    { text: ["The","book","fell","down"],        type: "noun", answer: "book" },
    { text: ["I","found","a","feather"],         type: "noun", answer: "feather" },
  ];
  const item = pick(set, rng);
  return {
    subject: "grammar",
    type: "word_class",
    prompt: `Which word is a ${item.type}?`,
    sentence: item.text.join(" "),
    audio: `In this sentence: ${item.text.join(" ")}. Which word is a ${item.type}?`,
    answer: item.answer,
    options: shuffle(item.text, rng),
    mode: "choice",
  };
}

function qCewMissing(rng, pool) {
  const target = pick(pool.filter(w => w.length >= 3 && w !== "I"), rng);
  const idx = 1; // hide 2nd letter
  const hidden = target[idx];
  const shown = target.slice(0, idx) + "_" + target.slice(idx + 1);
  return {
    subject: "cew",
    type: "cew_missing",
    prompt: `Fill in the missing letter:`,
    word: shown,
    full: target,
    audio: `What letter is missing in the word ${target}?`,
    answer: hidden,
    mode: "type",
  };
}

/* ============================ PRESCHOOL QUESTION GENERATORS ============================ */
function qLetterName(rng) {
  const letter = pick(PHASE2, rng);
  const distractors = sample(PHASE2.filter(l => l !== letter), 3, rng);
  const example = PHONEME_EXAMPLE[letter] || letter;
  return {
    subject: "phonics",
    type: "letter_name",
    prompt: `Which letter makes the sound at the start of "${example}"?`,
    audio: `Which letter makes the sound at the start of ${example}?`,
    answer: letter,
    options: shuffle([letter, ...distractors], rng),
    mode: "choice",
  };
}

function qInitialSound(rng) {
  const word = pick(CVC, rng);
  const initial = word[0];
  const distractors = sample("satpinmdgockubelfhr".split("").filter(l => l !== initial), 3, rng);
  return {
    subject: "phonics",
    type: "initial_sound",
    prompt: `What letter does this word start with?`,
    word,
    audio: `What letter does the word ${word} start with?`,
    answer: initial,
    options: shuffle([initial, ...distractors], rng),
    mode: "choice",
  };
}

function qCvcRead(rng) {
  const target = pick(CVC, rng);
  const distractors = sample(CVC.filter(w => w !== target), 3, rng);
  return {
    subject: "reading",
    type: "cvc_read",
    prompt: `Which word is this?`,
    audio: `Which word says ${target}?`,
    spoken: target,
    answer: target,
    options: shuffle([target, ...distractors], rng),
    mode: "choice",
  };
}

function qRhyme(rng) {
  const [a, b] = pick(RHYMES, rng);
  const otherPairs = RHYMES.filter(p => !p.includes(a));
  const distractors = sample(otherPairs, 3, rng).map(p => p[0]);
  return {
    subject: "reading",
    type: "rhyme",
    prompt: `Which word rhymes with "${a}"?`,
    audio: `Which word rhymes with ${a}?`,
    answer: b,
    options: shuffle([b, ...distractors], rng),
    mode: "choice",
  };
}

function qPhase3Sound(rng) {
  const pair = pick(PHASE3, rng);
  const word = pick(pair.words, rng);
  const distractors = sample(PHASE3.filter(p => p.g !== pair.g), 3, rng).map(p => p.g);
  return {
    subject: "phonics",
    type: "phase3",
    prompt: `Which sound do you hear in this word?`,
    word,
    audio: `Which sound do you hear in the word ${word}?`,
    answer: pair.g,
    options: shuffle([pair.g, ...distractors], rng),
    mode: "choice",
  };
}

/* ============================ DAY GENERATION ============================ */
// Bias which question types appear based on past accuracy per subject, so subjects the
// child struggles with come up more often and subjects they've mastered come up less -
// but never disappear entirely, so no topic ever goes fully untouched.
function subjectWeight(subjects, subjectKey) {
  const s = subjects && subjects[subjectKey];
  if (!s || s.attempts < 6) return 1;
  const acc = s.correct / s.attempts;
  if (acc < 0.6) return 3;
  if (acc < 0.8) return 2;
  if (acc >= 0.95) return 0.5;
  return 1;
}

function weightedGeneratorPool(entries, subjects) {
  const pool = [];
  for (const entry of entries) {
    const copies = Math.max(1, Math.round(subjectWeight(subjects, entry.subject)));
    for (let i = 0; i < copies; i++) pool.push(entry.make);
  }
  return pool;
}

function generateY1Day(rng, term, subjects) {
  // CEW pool grows through the year
  let cewPool;
  if (term === "autumn") {
    cewPool = ["the","a","do","to","of","said","I","you","be","he","me","she","we","no","go","so","my","is","was"];
  } else if (term === "spring") {
    cewPool = Y1_CEW.slice(0, 30);
  } else {
    cewPool = Y1_CEW;
  }

  // Pools of question generators per term
  const generators = [
    { subject: "phonics", make: () => qPhonicsGrapheme(rng) },
    { subject: "phonics", make: () => qPhonicsFindWord(rng) },
    { subject: "spelling", make: () => qCewSpell(rng, cewPool) },
    { subject: "spelling", make: () => qCewSpell(rng, cewPool) },
    { subject: "spelling", make: () => qHfwSpell(rng, Y1_HFW) },
    { subject: "punctuation", make: () => qFullStopOrQuestion(rng) },
    { subject: "punctuation", make: () => qCapital(rng) },
  ];
  if (term !== "autumn") {
    generators.push({ subject: "grammar", make: () => qPlural(rng) });
    generators.push({ subject: "grammar", make: () => qSuffixIng(rng) });
    generators.push({ subject: "cew", make: () => qCewMissing(rng, cewPool) });
  }
  if (term === "summer") {
    generators.push({ subject: "grammar", make: () => qSuffixEd(rng) });
    generators.push({ subject: "grammar", make: () => qPrefixUn(rng) });
    generators.push({ subject: "punctuation", make: () => qExclaim(rng) });
    generators.push({ subject: "grammar", make: () => qConjunction(rng) });
    generators.push({ subject: "grammar", make: () => qWordClass(rng) });
    generators.push({ subject: "grammar", make: () => qIrregularPast(rng) });
    generators.push({ subject: "grammar", make: () => qIrregularPast(rng) }); // doubled so it appears more often
  }

  // 10 main questions, varied across generators, weighted toward weaker subjects
  const main = [];
  const shuffled = shuffle(weightedGeneratorPool(generators, subjects), rng);
  // Cycle through generators ensuring variety
  for (let i = 0; i < 10; i++) {
    const gen = shuffled[i % shuffled.length];
    main.push(gen());
  }

  // 2 challenger questions (push into the next stretch)
  let challenger;
  if (term === "autumn") {
    challenger = [qPlural(rng), qSuffixIng(rng)];
  } else if (term === "spring") {
    challenger = [qPrefixUn(rng), qIrregularPast(rng)];
  } else {
    challenger = [qIrregularPast(rng), qConjunction(rng)];
  }

  return [
    ...main.map((q, i) => ({ ...q, idx: i, challenger: false })),
    ...challenger.map((q, i) => ({ ...q, idx: 10 + i, challenger: true })),
  ];
}

function generatePreschoolDay(rng, term, subjects) {
  const generators = [
    { subject: "phonics", make: () => qLetterName(rng) },
    { subject: "phonics", make: () => qInitialSound(rng) },
  ];
  if (term !== "autumn") {
    generators.push({ subject: "reading", make: () => qCvcRead(rng) });
    generators.push({ subject: "reading", make: () => qRhyme(rng) });
  }
  if (term === "summer") {
    generators.push({ subject: "phonics", make: () => qPhase3Sound(rng) });
  }

  const main = [];
  const shuffled = shuffle(weightedGeneratorPool(generators, subjects), rng);
  for (let i = 0; i < 8; i++) { // 8 questions for preschool, smaller dose
    const gen = shuffled[i % shuffled.length];
    main.push(gen());
  }
  // 2 challenger
  const challenger = term === "autumn"
    ? [qCvcRead(rng), qRhyme(rng)]
    : [qPhase3Sound(rng), qCvcRead(rng)];

  return [
    ...main.map((q, i) => ({ ...q, idx: i, challenger: false })),
    ...challenger.map((q, i) => ({ ...q, idx: 8 + i, challenger: true })),
  ];
}

// ============================================================
// Year-level auto-progression
// Each profile has a "yearStart" date - the academic year (Sept-Aug) in which they
// started Year 1, expressed as the calendar year of the September. So 2025 means
// Year 1 was 2025/26.
// Charlie: yearStart = 2025 (Year 1 in 2025/26 - the current academic year)
// Freddie: yearStart = 2027 (Year 1 will be 2027/28 - he's preschool now, Reception in 2026/27)
// Anyone without a yearStart falls back to the static profile.year for backwards compatibility.
// ============================================================
function getCurrentLevel(profile) {
  if (!profile) return "year1";
  if (profile.yearStart) {
    const now = new Date();
    const month = now.getMonth(); // 0=Jan
    const yr = now.getFullYear();
    // Current academic year starts in Sept (month 8). Before Sept, we're in the year that started last calendar year.
    const currentAcademicYear = month >= 8 ? yr : yr - 1;
    const offsetFromYear1 = currentAcademicYear - profile.yearStart;
    if (offsetFromYear1 < -1) return "preschool"; // 2+ years before Year 1
    if (offsetFromYear1 === -1) return "reception"; // year before Year 1
    if (offsetFromYear1 === 0) return "year1";
    if (offsetFromYear1 === 1) return "year2";
    if (offsetFromYear1 === 2) return "year3";
    if (offsetFromYear1 === 3) return "year4";
    return "year" + offsetFromYear1;
  }
  // Legacy: use the static field
  return profile.year || "year1";
}

// Map a level to a content tier - what curriculum bucket to actually use.
// We have preschool and year1 content. Reception uses preschool, Year 2+ uses year1
// (until we build out dedicated content).
function getContentTier(level) {
  if (level === "preschool" || level === "reception") return "preschool";
  return "year1";
}

function getLevelLabel(level) {
  return {
    preschool: "Preschool",
    reception: "Reception",
    year1: "Year 1",
    year2: "Year 2",
    year3: "Year 3",
    year4: "Year 4",
    year5: "Year 5",
    year6: "Year 6",
  }[level] || "Year 1";
}

// Challenge mode: once a child has strung together several strong days in a row, quietly
// serve the next term's harder content instead of letting them plateau at their current
// term's questions. Requires a real run of good days (not one lucky session) before kicking in.
const CHALLENGE_STREAK_DAYS = 3;
const CHALLENGE_THRESHOLD = 0.9;
function isReadyForChallenge(profile) {
  const days = (profile && profile.days) || {};
  const dates = Object.keys(days).sort(); // ISO sorts chronologically
  const recent = dates.slice(-CHALLENGE_STREAK_DAYS);
  if (recent.length < CHALLENGE_STREAK_DAYS) return false;
  return recent.every(d => {
    const rec = days[d];
    return rec && rec.total >= 8 && (rec.score / rec.total) >= CHALLENGE_THRESHOLD;
  });
}
const NEXT_TERM = { autumn: "spring", spring: "summer", summer: "summer" };

function generateDay(profile, dateISO) {
  const rng = seededRng(`${profile.id}-${dateISO}`);
  let term = getTerm(new Date(dateISO + "T00:00:00"));
  if (isReadyForChallenge(profile)) term = NEXT_TERM[term] || term;
  const tier = getContentTier(getCurrentLevel(profile));
  return tier === "preschool"
    ? generatePreschoolDay(rng, term, profile.subjects)
    : generateY1Day(rng, term, profile.subjects);
}

/* ============================ UI: ROOT ============================ */
function PhonicsApp() {
  const [data, setData] = useState(null);
  const [view, setView] = useState("home"); // home | practice | results | collection | settings
  const [ready, setReady] = useState(false);
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [fbConnected, setFbConnected] = useState(false);
  const [authAllowed, setAuthAllowed] = useState(!!window._authAllowed);

  // Re-run the data load/subscribe effect below whenever sign-in state changes, so signing
  // in or out actually (re)connects to (or disconnects from) Firebase rather than only taking
  // effect on the next full page reload.
  useEffect(() => {
    const onAuthChange = () => setAuthAllowed(!!window._authAllowed);
    onAuthChange();
    window.addEventListener("english-minutes-auth-changed", onAuthChange);
    return () => window.removeEventListener("english-minutes-auth-changed", onAuthChange);
  }, []);

  useEffect(() => {
    let mounted = true;
    loadData().then(d => { if (mounted) { setData(d); setReady(true); setLastSyncedAt(new Date()); } });
    // Subscribe to remote changes for cross-device sync
    const unsub = subscribeData((d) => {
      if (mounted) {
        setLastSyncedAt(new Date());
        // Only update if the data is meaningfully newer (avoid feedback loops)
        setData(prev => {
          if (!prev) return d;
          if (JSON.stringify(prev) === JSON.stringify(d)) return prev;
          return d;
        });
      }
    });

    // Force-refresh from Firebase when the app comes back to the foreground. iOS
    // suspends background apps and the Firebase socket can go stale - this guarantees
    // we always show the latest data immediately when Mark or Hannah opens the app.
    const refreshNow = async () => {
      if (!canSyncFirebase()) return;
      try {
        const snap = await firebase.database().ref(FB_PATH).once("value");
        const v = snap.val();
        if (v && mounted) {
          const merged = mergeWithDefault(v);
          updateHighWater(merged);
          try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
          setData(prev => {
            if (!prev) return merged;
            if (JSON.stringify(prev) === JSON.stringify(merged)) return prev;
            return merged;
          });
          setLastSyncedAt(new Date());
        }
      } catch (e) { console.warn("Refresh failed:", e); }
    };

    const onVisible = () => { if (document.visibilityState === "visible") refreshNow(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", refreshNow);
    window.addEventListener("pageshow", refreshNow); // iOS Safari fires this on back-forward cache restore

    // Track Firebase's live connection state (true = receiving updates from server)
    let connRef = null;
    let connHandler = null;
    if (canSyncFirebase()) {
      connRef = firebase.database().ref(".info/connected");
      connHandler = connRef.on("value", (snap) => {
        if (mounted) {
          const connected = !!snap.val();
          setFbConnected(connected);
          window._fbConnected = connected;
        }
      });
    }

    // Expose a manual sync function on window so Settings can call it
    window._forceSyncNow = refreshNow;

    return () => {
      mounted = false;
      unsub();
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", refreshNow);
      window.removeEventListener("pageshow", refreshNow);
      if (connRef && connHandler) connRef.off("value", connHandler);
    };
  }, [authAllowed]);

  // Sync user-selected voice name with the speech module
  useEffect(() => {
    if (data) setUserVoice(data.voiceName || null);
  }, [data && data.voiceName]);

  // Mirror lastSyncedAt to window so SyncStatusCard (and any other component) can read it
  useEffect(() => {
    window._lastSyncedAt = lastSyncedAt;
  }, [lastSyncedAt]);

  const persist = (next) => {
    setData(next);
    saveData(next);
  };
  const activeProfile = data && data.activeId ? data.profiles[data.activeId] : null;

  if (!ready) return <div style={{ minHeight: "100vh", background: "#F5EFE6" }} />;

  return (
    <div style={S.shell}>
      <style>{cssReset}</style>
      {!activeProfile ? (
        <ProfilePicker data={data} onPick={(id) => persist({ ...data, activeId: id })} />
      ) : (
        <>
          <Header data={data} profile={activeProfile} onSwitch={(id) => persist({ ...data, activeId: id })} />
          {view === "home" && <HomeView profile={activeProfile} data={data} setData={persist} onStart={() => setView("practice")} setView={setView} />}
          {view === "practice" && <PracticeView profile={activeProfile} data={data} setData={persist} onDone={() => setView("home")} />}
          {view === "results" && <ResultsView profile={activeProfile} onBack={() => setView("home")} />}
          {view === "collection" && <CharacterBuilderView profile={activeProfile} data={data} setData={persist} onBack={() => setView("home")} />}
          {view === "settings" && <PhonicsSettingsView profile={activeProfile} data={data} setData={persist} onBack={() => setView("home")} />}
          {view !== "practice" && <BottomNav view={view} setView={setView} />}
        </>
      )}
    </div>
  );
}

      </div>

  );
}

/* ============================ PRACTICE ============================ */
function PracticeView({ profile, data, setData, onDone }) {
  const today = todayISO();
  const [extraSeed, setExtraSeed] = useState(0);
  const questions = useMemo(() => generateDay(profile, today + (extraSeed ? "-x" + extraSeed : "")), [profile.id, profile.year, profile.yearStart, today, extraSeed]);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [typed, setTyped] = useState("");
  const [showFeedback, setShowFeedback] = useState(false);
  const inputRef = useRef(null);
  const q = questions[idx];
  const isExtra = extraSeed > 0;

  useEffect(() => {
    if (q && q.audio) speak(q.audio);
    setTyped("");
    setShowFeedback(false);
    if (q && q.mode === "type" && inputRef.current) {
      setTimeout(() => inputRef.current && inputRef.current.focus(), 100);
    }
  }, [idx, extraSeed]);

  if (!q) {
    return <DoneScreen profile={profile} data={data} setData={setData} answers={answers} questions={questions} onDone={onDone} isExtra={isExtra} onExtra={() => { setExtraSeed(extraSeed + 1); setIdx(0); setAnswers({}); }} />;
  }

  const handleChoice = (option) => {
    const correct = option === q.answer;
    const newAnswers = { ...answers, [idx]: { value: option, correct } };
    setAnswers(newAnswers);
    setShowFeedback(true);
    setTimeout(() => {
      setShowFeedback(false);
      setIdx(idx + 1);
    }, 900);
  };

  const handleType = () => {
    if (!typed.trim()) return;
    const correct = typed.trim().toLowerCase() === String(q.answer).toLowerCase();
    const newAnswers = { ...answers, [idx]: { value: typed.trim(), correct } };
    setAnswers(newAnswers);
    setShowFeedback(true);
    setTimeout(() => {
      setShowFeedback(false);
      setIdx(idx + 1);
    }, 1100);
  };

  const total = questions.length;
  const pct = Math.round((idx / total) * 100);
  const score = Object.values(answers).filter(a => a.correct).length;

  return (
    <div style={S.body}>
      <div style={S.practiceTop}>
        <div style={S.progressBar}>
          <div style={{ ...S.progressFill, width: `${pct}%` }} />
        </div>
        <div style={S.progressLabel}>Question {idx + 1} of {total}</div>
      </div>

      {q.challenger && (
        <div style={S.challengerBadge}>
          <Sparkles size={12} /> <span style={{ marginLeft: 4 }}>Challenger question</span>
        </div>
      )}

      <div style={S.subjectChip} >
        <span style={{ ...S.subjectDot, background: SUBJECTS[q.subject].colour }} />
        {SUBJECTS[q.subject].label}
      </div>

      <div style={S.qCard}>
        <div style={S.qPrompt}>
          {q.prompt}
          <button style={S.speakBtn} onClick={() => speak(q.audio || q.prompt)}>
            <Volume2 size={18} />
          </button>
        </div>

        {q.bigChar && (
          <div style={S.bigChar}>{q.bigChar}</div>
        )}
        {q.word && !q.bigChar && (
          <div style={S.wordBox}>{q.word}</div>
        )}
        {q.sentence && (
          <div style={S.sentenceBox}>"{q.sentence}"</div>
        )}
        {q.spoken && q.mode === "type" && !q.word && !q.sentence && (
          <button style={S.hearBtn} onClick={() => speak(q.spoken)}>
            <Volume2 size={16} /> <span style={{ marginLeft: 6 }}>Hear it again</span>
          </button>
        )}

        {q.mode === "choice" && (
          <div style={S.choicesGrid}>
            {q.options.map((opt, i) => {
              const isAnswered = showFeedback && answers[idx] && answers[idx].value === opt;
              const isCorrect = showFeedback && opt === q.answer && answers[idx];
              return (
                <button
                  key={i}
                  onClick={() => !showFeedback && handleChoice(opt)}
                  disabled={showFeedback}
                  style={{
                    ...S.choiceBtn,
                    ...(isCorrect ? S.choiceCorrect : {}),
                    ...(isAnswered && !answers[idx].correct ? S.choiceWrong : {}),
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        )}

        {q.mode === "type" && (
          <div style={{ marginTop: 18 }}>
            <input
              ref={inputRef}
              value={typed}
              onChange={(e) => setTyped(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && handleType()}
              placeholder="Type your answer"
              autoCapitalize="none"
              autoCorrect="off"
              spellCheck="false"
              style={S.typeInput}
            />
            <button onClick={handleType} disabled={showFeedback} style={S.submitBtn}>
              Check answer
            </button>
            {showFeedback && answers[idx] && (
              <div style={{ ...S.feedback, color: answers[idx].correct ? "#1a6d4a" : "#a23030", marginTop: 12 }}>
                {answers[idx].correct ? (
                  <><Check size={16} /> <span style={{ marginLeft: 6 }}>Brilliant!</span></>
                ) : (
                  <><X size={16} /> <span style={{ marginLeft: 6 }}>The answer was "{q.answer}"</span></>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      <div style={S.scorePill}>
        <Star size={14} color="#D4A04A" />
        <span style={{ marginLeft: 6 }}>{score} correct so far</span>
      </div>
    </div>
  );
}

/* ============================ DONE SCREEN ============================ */
function Confetti() {
  const pieces = useMemo(() => {
    const colors = ["#D4A04A", "#3DAA7C", "#E07856", "#7AA095", "#D4823F"];
    return Array.from({ length: 32 }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      delay: Math.random() * 0.5,
      duration: 2.4 + Math.random() * 1.4,
      color: colors[i % colors.length],
      size: 6 + Math.random() * 6,
      spin: 180 + Math.random() * 540,
    }));
  }, []);
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 999 }} aria-hidden="true">
      <style>{`
        @keyframes englishMinutesConfettiFall {
          0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
          100% { transform: translateY(110vh) rotate(var(--spin)); opacity: 0; }
        }
      `}</style>
      {pieces.map(p => (
        <div key={p.id} style={{
          position: "absolute", top: 0, left: `${p.left}%`,
          width: p.size, height: p.size * 1.6,
          background: p.color, borderRadius: 2,
          "--spin": `${p.spin}deg`,
          animation: `englishMinutesConfettiFall ${p.duration}s ease-in ${p.delay}s 1 forwards`,
        }} />
      ))}
    </div>
  );
}

function DoneScreen({ profile, data, setData, answers, questions, onDone, onExtra, isExtra }) {
  const [showReview, setShowReview] = useState(false);
  const total = questions.length;
  const score = Object.values(answers).filter(a => a.correct).length;
  const pct = Math.round((score / total) * 100);

  // Update data once
  useEffect(() => {
    const today = todayISO();
    const alreadyDone = profile.days && profile.days[today];
    // If this is a fresh first-of-day run AND day already saved, skip (re-render guard)
    if (!isExtra && alreadyDone) return;

    // Per-subject tally
    const perSubject = {};
    questions.forEach((q, i) => {
      const sub = q.subject;
      if (!perSubject[sub]) perSubject[sub] = { attempts: 0, correct: 0 };
      perSubject[sub].attempts += 1;
      if (answers[i] && answers[i].correct) perSubject[sub].correct += 1;
    });

    // Aggregate into profile subjects
    const subjects = { ...(profile.subjects || {}) };
    for (const [k, v] of Object.entries(perSubject)) {
      if (!subjects[k]) subjects[k] = { attempts: 0, correct: 0 };
      subjects[k].attempts += v.attempts;
      subjects[k].correct += v.correct;
    }

    let earned, streak, lastDate, days;
    if (isExtra) {
      // Bonus practice: 2 points per correct, no day bonus, streak unchanged.
      // BUT we DO extend the day record so all activity is visible in Results.
      earned = score * 2;
      streak = profile.streak || 0;
      lastDate = profile.lastDate;

      const existingDay = (profile.days || {})[today] || {
        score: 0, total: 0, finishedAt: new Date().toISOString(),
        perSubject: {}, earned: 0, bonusRounds: 0,
      };

      // Merge perSubject from this bonus round into the day's perSubject
      const mergedDayPerSubject = { ...(existingDay.perSubject || {}) };
      for (const [k, v] of Object.entries(perSubject)) {
        if (!mergedDayPerSubject[k]) mergedDayPerSubject[k] = { attempts: 0, correct: 0 };
        mergedDayPerSubject[k].attempts += v.attempts;
        mergedDayPerSubject[k].correct += v.correct;
      }

      days = {
        ...(profile.days || {}),
        [today]: {
          ...existingDay,
          score: (existingDay.score || 0) + score,
          total: (existingDay.total || 0) + total,
          earned: (existingDay.earned || 0) + earned,
          perSubject: mergedDayPerSubject,
          bonusRounds: (existingDay.bonusRounds || 0) + 1,
          lastActivityAt: new Date().toISOString(),
        },
      };
    } else {
      const challengerCorrect = questions.filter((q, i) => q.challenger && answers[i] && answers[i].correct).length;
      earned = score * 5 + 10 + challengerCorrect * 5;
      // Streak
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
      const yISO = (() => {
        const y = yesterday.getFullYear(), m = String(yesterday.getMonth() + 1).padStart(2, "0"), dd = String(yesterday.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      })();
      streak = profile.streak || 0;
      if (profile.lastDate === yISO) streak += 1;
      else if (profile.lastDate === today) {} // unchanged
      else streak = 1;
      lastDate = today;
      days = { ...(profile.days || {}), [today]: { score, total, finishedAt: new Date().toISOString(), perSubject, earned, bonusRounds: 0 } };
    }

    const next = {
      ...data,
      profiles: {
        ...data.profiles,
        [profile.id]: {
          ...profile,
          points: (profile.points || 0) + earned,
          streak, lastDate, subjects, days,
        },
      },
    };
    setData(next);
  }, []);

  const earnedPoints = isExtra ? score * 2 : score * 5 + 10;

  if (showReview) {
    return <ReviewScreen questions={questions} answers={answers} onBack={() => setShowReview(false)} />;
  }

  return (
    <div style={S.body}>
      {pct >= 80 && <Confetti />}
      <div style={S.doneTitle}>{
        isExtra
          ? (pct >= 80 ? "On fire!" : pct >= 50 ? "Brilliant work!" : "Keep going!")
          : (pct >= 80 ? "Amazing work!" : pct >= 50 ? "Good job!" : "Keep going!")
      }</div>
      <div style={S.doneBig}>{score}/{total}</div>
      <div style={S.doneSub}>{pct}% correct{isExtra ? " · bonus round" : ""}</div>

      <div style={{ display: "flex", justifyContent: "center", margin: "8px 0" }}><CharacterPreview profile={profile} size={120} /></div>

      <div style={S.doneCard2}>
        <div style={{ fontWeight: 700, marginBottom: 6 }}>You earned</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 700, color: "#D4A04A" }}>
          <Star size={20} color="#D4A04A" /> <span style={{ marginLeft: 8 }}>{earnedPoints}{isExtra ? "" : "+"} points</span>
        </div>
      </div>

      <button onClick={() => setShowReview(true)} style={{ ...S.bigBtn, background: "#FAFAFA", color: "#143232", border: "2px solid #E5DDC9" }}>
        <BookOpen size={18} /> <span style={{ marginLeft: 8 }}>Review answers</span>
      </button>

      {/* Primary call to action: keep practising */}
      <div style={S.morePromptCard}>
        <div style={S.morePromptIcon}><Sparkles size={22} color="#D4A04A" /></div>
        <div style={S.morePromptText}>
          <div style={S.morePromptTitle}>Want to keep going?</div>
          <div style={S.morePromptSub}>{isExtra ? "Another round of fresh questions, worth 2 points each." : "New questions every time. Each one is worth 2 points."}</div>
        </div>
      </div>
      <button onClick={onExtra} style={{ ...S.bigBtn, background: "#D4823F", color: "#FAFAFA", marginTop: 0, fontWeight: 700 }}>
        <Pencil size={18} /> <span style={{ marginLeft: 8 }}>Do more questions</span>
      </button>

      <button onClick={onDone} style={{ ...S.bigBtn, background: "#143232", marginTop: 12 }}>
        <HomeIcon size={18} /> <span style={{ marginLeft: 8 }}>Back home</span>
      </button>
    </div>
  );
}

/* ============================ REVIEW ============================ */
function ReviewScreen({ questions, answers, onBack }) {
  const formatPromptText = (q) => {
    // Build a readable prompt that includes any embedded word
    if (q.word) return `${q.prompt} (${q.word})`;
    if (q.spoken) return `${q.prompt} (${q.spoken})`;
    return q.prompt;
  };

  const formatAnswerValue = (q, val) => {
    if (val === undefined || val === null) return "(no answer)";
    return String(val);
  };

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Done</span></button>
      <div style={S.pageTitle}>Review</div>
      <div style={S.subTitle}>See what you got right and how to improve.</div>

      {questions.map((q, i) => {
        const ans = answers[i];
        const correct = ans && ans.correct;
        return (
          <div key={i} style={{
            ...S.reviewCard,
            borderColor: correct ? "#7AA095" : "#E07A5F",
          }}>
            <div style={S.reviewHeader}>
              <div style={S.reviewQNum}>Q{i + 1}{q.challenger ? " · challenger" : ""}</div>
              <div style={{
                ...S.reviewBadge,
                background: correct ? "#E1ECE6" : "#FCE6DD",
                color: correct ? "#2E5A4A" : "#9A3F25",
              }}>
                {correct ? <><Check size={12} /> <span style={{ marginLeft: 4 }}>Correct</span></> : <><X size={12} /> <span style={{ marginLeft: 4 }}>Try again</span></>}
              </div>
            </div>

            <div style={S.reviewPrompt}>{formatPromptText(q)}</div>

            <div style={S.reviewRow}>
              <div style={S.reviewLabel}>Your answer</div>
              <div style={{
                ...S.reviewValue,
                color: correct ? "#2E5A4A" : "#9A3F25",
                fontWeight: 700,
              }}>{formatAnswerValue(q, ans ? ans.value : null)}</div>
            </div>

            {!correct && (
              <div style={S.reviewRow}>
                <div style={S.reviewLabel}>Correct answer</div>
                <div style={{ ...S.reviewValue, color: "#2E5A4A", fontWeight: 700 }}>{String(q.answer)}</div>
              </div>
            )}
          </div>
        );
      })}

      <button onClick={onBack} style={{ ...S.bigBtn, marginTop: 8 }}>
        <ArrowLeft size={18} /> <span style={{ marginLeft: 8 }}>Back to summary</span>
      </button>
    </div>
  );
}

/* ============================ RESULTS ============================ */
function ResultsView({ profile, onBack }) {
  const subjects = profile.subjects || {};
  const days = profile.days || {};
  const dayCount = Object.keys(days).length;
  const totalCorrect = Object.values(days).reduce((s, d) => s + (d.score || 0), 0);
  const totalQuestions = Object.values(days).reduce((s, d) => s + (d.total || 0), 0);

  // Sort subjects by accuracy
  const subjectRows = Object.entries(SUBJECTS).map(([key, meta]) => {
    const s = subjects[key];
    const acc = s && s.attempts > 0 ? Math.round((s.correct / s.attempts) * 100) : null;
    return { key, meta, attempts: s ? s.attempts : 0, correct: s ? s.correct : 0, acc };
  });

  const bestRow = subjectRows.filter(r => r.acc !== null).sort((a, b) => b.acc - a.acc)[0];
  const workRow = subjectRows.filter(r => r.acc !== null && r.attempts >= 5).sort((a, b) => a.acc - b.acc)[0];

  // This week's per-subject accuracy (last 7 calendar days), separate from the all-time
  // totals above - lets a parent see what's fresh right now, not just the cumulative picture.
  const weekSubjects = {};
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const rec = days[iso];
    if (!rec || !rec.perSubject) continue;
    for (const [k, v] of Object.entries(rec.perSubject)) {
      if (!weekSubjects[k]) weekSubjects[k] = { attempts: 0, correct: 0 };
      weekSubjects[k].attempts += v.attempts;
      weekSubjects[k].correct += v.correct;
    }
  }
  const weekRows = Object.entries(SUBJECTS).map(([key, meta]) => {
    const s = weekSubjects[key];
    const acc = s && s.attempts > 0 ? Math.round((s.correct / s.attempts) * 100) : null;
    return { key, meta, attempts: s ? s.attempts : 0, acc };
  });
  const weekBest = weekRows.filter(r => r.acc !== null && r.attempts >= 3).sort((a, b) => b.acc - a.acc)[0];
  const weekWork = weekRows.filter(r => r.acc !== null && r.attempts >= 3).sort((a, b) => a.acc - b.acc)[0];

  // Last 14 days for streak chart
  const last14 = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    last14.push({
      iso,
      day: d.toLocaleDateString("en-GB", { weekday: "narrow" }),
      done: !!days[iso],
      score: days[iso] ? days[iso].score : 0,
      total: days[iso] ? days[iso].total : 0,
      bonusRounds: days[iso] ? (days[iso].bonusRounds || 0) : 0,
    });
  }

  return (
    <div style={S.body}>
      <button onClick={onBack} style={S.backBtn}><ArrowLeft size={16} /> <span style={{ marginLeft: 6 }}>Home</span></button>
      <div style={S.pageTitle}>Results</div>

      <div style={S.statsRow}>
        <div style={S.statBox}>
          <div style={S.statNum}>{dayCount}</div>
          <div style={S.statLabel}>Days done</div>
        </div>
        <div style={S.statBox}>
          <div style={S.statNum}>{totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0}%</div>
          <div style={S.statLabel}>Overall</div>
        </div>
        <div style={S.statBox}>
          <div style={S.statNum}>{profile.streak || 0}</div>
          <div style={S.statLabel}>Streak</div>
        </div>
      </div>

      {(() => {
        const today = todayISO();
        const td = days[today];
        if (!td) return null;
        const bonusRounds = td.bonusRounds || 0;
        const totalQs = td.total || 0;
        return (
          <div style={S.todayCard}>
            <div style={S.todayHeader}>
              <Sparkles size={16} color="#D4A04A" />
              <span style={{ marginLeft: 6, fontWeight: 700, fontSize: 14 }}>Today's activity</span>
            </div>
            <div style={S.todayStats}>
              <div style={S.todayStat}>
                <div style={S.todayStatNum}>{td.score || 0}<span style={S.todayStatTotal}>/{totalQs}</span></div>
                <div style={S.todayStatLabel}>questions correct</div>
              </div>
              <div style={S.todayStat}>
                <div style={S.todayStatNum}>{1 + bonusRounds}</div>
                <div style={S.todayStatLabel}>{bonusRounds === 0 ? "round done" : `rounds done${bonusRounds > 0 ? ` (1 + ${bonusRounds} bonus)` : ""}`}</div>
              </div>
              <div style={S.todayStat}>
                <div style={S.todayStatNum}>{td.earned || 0}</div>
                <div style={S.todayStatLabel}>points earned</div>
              </div>
            </div>
          </div>
        );
      })()}

      {(bestRow || workRow) && (
        <div style={S.insightCard}>
          {bestRow && (
            <div style={{ marginBottom: workRow ? 10 : 0 }}>
              <div style={S.insightLabel}>You're great at</div>
              <div style={S.insightValue}>
                <span style={{ ...S.subjectDot, background: bestRow.meta.colour }} />
                {bestRow.meta.label} ({bestRow.acc}%)
              </div>
            </div>
          )}
          {workRow && workRow.key !== (bestRow && bestRow.key) && (
            <div>
              <div style={S.insightLabel}>Let's work on</div>
              <div style={S.insightValue}>
                <span style={{ ...S.subjectDot, background: workRow.meta.colour }} />
                {workRow.meta.label} ({workRow.acc}%)
              </div>
            </div>
          )}
        </div>
      )}

      {(weekBest || weekWork) && (
        <div style={S.insightCard}>
          <div style={{ ...S.insightLabel, marginBottom: 6 }}>This week</div>
          {weekBest && (
            <div style={{ marginBottom: weekWork ? 10 : 0 }}>
              <div style={S.insightLabel}>Strongest</div>
              <div style={S.insightValue}>
                <span style={{ ...S.subjectDot, background: weekBest.meta.colour }} />
                {weekBest.meta.label} ({weekBest.acc}%)
              </div>
            </div>
          )}
          {weekWork && weekWork.key !== (weekBest && weekBest.key) && (
            <div>
              <div style={S.insightLabel}>Worth practising</div>
              <div style={S.insightValue}>
                <span style={{ ...S.subjectDot, background: weekWork.meta.colour }} />
                {weekWork.meta.label} ({weekWork.acc}%)
              </div>
            </div>
          )}
        </div>
      )}

      <div style={S.sectionTitle}>By subject</div>
      <div>
        {subjectRows.map((r) => (
          <div key={r.key} style={S.subjectRow}>
            <div style={{ display: "flex", alignItems: "center", marginBottom: 6 }}>
              <span style={{ ...S.subjectDot, background: r.meta.colour }} />
              <span style={{ fontWeight: 600, flex: 1 }}>{r.meta.label}</span>
              <span style={{ color: "#5a6b5f", fontSize: 13 }}>
                {r.attempts > 0 ? `${r.correct}/${r.attempts}` : "Not yet"}
              </span>
            </div>
            <div style={S.barTrack}>
              <div style={{ ...S.barFill, width: r.acc !== null ? `${r.acc}%` : "0%", background: r.meta.colour }} />
            </div>
            {r.acc !== null && (
              <div style={{ fontSize: 12, color: "#5a6b5f", marginTop: 4 }}>{r.acc}%</div>
            )}
          </div>
        ))}
      </div>

      <div style={S.sectionTitle}>Last 14 days</div>
      <div style={S.calRow}>
        {last14.map(d => (
          <div key={d.iso} style={S.calDay}>
            <div style={{
              ...S.calDot,
              background: d.done ? (d.score / d.total >= 0.8 ? "#3DAA7C" : d.score / d.total >= 0.5 ? "#D4A04A" : "#E07856") : "#E5DDC9",
              position: "relative",
            }}>
              {d.done ? d.score : ""}
              {d.bonusRounds > 0 && (
                <span title={`${d.bonusRounds} bonus round${d.bonusRounds > 1 ? "s" : ""}`} style={S.calBonusBadge}>
                  +{d.bonusRounds}
                </span>
              )}
            </div>
            <div style={S.calLabel}>{d.day}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
